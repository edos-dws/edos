<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EDOS — Engineering Decision OS</title>
<style>
  /* ---- design system (matches EDOS_v3 walkthrough: light theme, navy brain bar, purple accent) ---- */
  :root{
    --bg:#eef1f7; --surface:#ffffff; --ink:#1a2030; --ink2:#5a6478; --line:#e3e7f0;
    --accent:#6d5efc; --accent2:#8b7bff; --navy:#0f1629; --navy2:#1a2340;
    /* finding categories */
    --contradiction:#e5484d; --hiddendep:#e5891a; --assumption:#e0b400; --optimization:#3b82f6; --bestpractice:#22a565;
    /* coverage gradient */
    --cov:linear-gradient(90deg,#e5484d,#e5891a,#e0b400,#22a565);
    --radius:12px; --shadow:0 1px 3px rgba(20,30,60,.08),0 1px 2px rgba(20,30,60,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex}
  h1,h2,h3,h4{margin:0}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:.5rem .85rem;background:var(--accent);color:#fff;font-weight:500}
  button.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  button.sm{padding:.25rem .5rem;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  input,textarea,select{width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem}
  a{color:var(--accent);text-decoration:none}
  .muted{color:var(--ink2)} .row{display:flex;gap:.6rem;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1}
  .hide{display:none}

  /* left rail */
  .rail{width:250px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:1rem}
  .brand{font-weight:800;font-size:20px;letter-spacing:.12em;background:linear-gradient(90deg,var(--accent),#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand-sub{font-size:10px;letter-spacing:.18em;color:var(--ink2);margin:.1rem 0 1rem}
  .proj{padding:.5rem .55rem;border-radius:8px;cursor:pointer;display:flex;gap:.4rem;align-items:center}
  .proj:hover,.proj.active{background:#f0f2f9}
  .proj .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .tabs{display:flex;gap:.2rem;padding:.5rem 1.2rem 0;background:var(--surface);border-bottom:1px solid var(--line)}
  .tab{background:transparent;color:var(--ink2);border-radius:0;border-bottom:2px solid transparent;padding:.6rem .8rem;font-weight:500}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent)}
  .view{flex:1;overflow:auto;padding:1.4rem;max-width:1080px;width:100%;margin:0 auto}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1rem;margin-bottom:1.1rem}
  .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--ink2);font-weight:700;text-transform:uppercase;margin-bottom:.5rem}

  /* project brain */
  .brainbar{background:var(--navy);color:#fff;border-radius:var(--radius) var(--radius) 0 0;padding:.9rem 1.2rem;display:flex;align-items:center;gap:.6rem;font-weight:600}
  .brainbar .dot{width:9px;height:9px;border-radius:50%;background:#3ddc97}
  .brainbody{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:1.2rem;box-shadow:var(--shadow)}
  .covwrap{display:flex;align-items:center;gap:1rem;margin-bottom:1.1rem}
  .covtrack{flex:1;height:12px;border-radius:20px;background:#e7eaf3;overflow:hidden}
  .covfill{height:100%;background:var(--cov);border-radius:20px;transition:width .5s}
  .covpct{font-size:26px;font-weight:800;color:var(--accent);min-width:70px;text-align:right}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.1rem}
  .tile{border:1px solid var(--line);border-radius:10px;padding:.9rem;text-align:center}
  .tile .n{font-size:28px;font-weight:800} .tile .l{font-size:11px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase;margin-top:.2rem}
  .domains{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
  .domain{border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem}
  .domain .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:.4rem}
  .dtrack{height:7px;border-radius:20px;background:#e7eaf3;overflow:hidden}
  .dfill{height:100%;background:linear-gradient(90deg,var(--accent),#4ec5ff);border-radius:20px}

  /* reusable finding / severity primitives (used by later UI-CPs) */
  .cat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.12rem .5rem;border-radius:5px;color:#fff}
  .cat.contradiction{background:var(--contradiction)} .cat.hidden_dependency{background:var(--hiddendep)}
  .cat.assumption{background:var(--assumption);color:#3a2e00} .cat.optimization{background:var(--optimization)} .cat.best_practice{background:var(--bestpractice)}
  .pill{display:inline-block;font-size:11px;padding:.1rem .5rem;border-radius:20px;border:1px solid var(--line)}
  .pill.critical{background:#e5484d;color:#fff;border-color:#e5484d} .pill.high{background:#e5891a;color:#fff;border-color:#e5891a}
  .pill.medium{background:#f2d675;color:#3a2e00;border-color:#e0b400} .pill.low{background:#dbe4f5;color:#2c3e66;border-color:#c3d2ec}
  .finding{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:.9rem 1rem;margin-bottom:.8rem}
  .finding.contradiction{border-left-color:var(--contradiction)} .finding.hidden_dependency{border-left-color:var(--hiddendep)}
  .finding.assumption{border-left-color:var(--assumption)} .finding.optimization{border-left-color:var(--optimization)} .finding.best_practice{border-left-color:var(--bestpractice)}
  .ignore{background:#fdf0f0;border:1px dashed #f2c3c3;border-radius:8px;padding:.6rem .8rem;margin-top:.6rem;font-size:13px}
  .ignore .h{color:var(--contradiction);font-weight:700;font-size:11px;letter-spacing:.08em}
  .chip{display:inline-block;font-size:11px;background:#eef0f8;border:1px solid var(--line);border-radius:6px;padding:.15rem .5rem;margin:.15rem .2rem 0 0}

  .empty{color:var(--ink2);text-align:center;padding:2rem}

  /* ---- UI-CP-4: Deep Dive Q&A ---- */
  .userinput{background:var(--navy);color:#dfe6f5;border-left:3px solid #3ddc97;border-radius:10px;padding:.9rem 1.1rem;margin-bottom:1.1rem}
  .userinput .l{font-size:10px;letter-spacing:.16em;color:#9fb0d0;font-weight:700}
  .qcard{border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;margin-bottom:.8rem;background:var(--surface)}
  .qcard .qh{color:var(--accent);font-weight:700;margin-bottom:.5rem}
  .whybox{background:#f3f1fe;border:1px solid #e2ddfb;border-radius:8px;padding:.6rem .8rem;margin-bottom:.6rem}
  .whybox .h{color:#6d5efc;font-weight:700;font-size:10px;letter-spacing:.1em}
  .whybox .t{font-size:13px;color:#3a3560;margin-top:.2rem}

  /* ---- UI-CP-4: Decision Card ---- */
  .deccard{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1.1rem;background:var(--surface)}
  .dechead{background:linear-gradient(120deg,#5b3fd6,#7c5cff 60%,#8b6bff);color:#fff;padding:1.1rem 1.2rem}
  .dechead .eye{font-size:11px;letter-spacing:.16em;font-weight:700;opacity:.85}
  .dechead h2{font-size:22px;margin:.15rem 0 .6rem}
  .dechead .meta{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;font-size:13px}
  .decstatus{font-size:11px;font-weight:800;letter-spacing:.08em;padding:.2rem .6rem;border-radius:5px;text-transform:uppercase}
  .decstatus.proposed,.decstatus.recommended{background:#f0d264;color:#3a2e00}
  .decstatus.accepted,.decstatus.verified{background:#3ddc97;color:#06331f}
  .decstatus.frozen{background:#dbe4f5;color:#2c3e66}
  .dechead .missing{color:#e7ddff}
  .decbody{padding:1.2rem}

  /* comparison matrix */
  .matrixwrap{overflow-x:auto}
  table.matrix{border-collapse:collapse;width:100%;font-size:13px}
  table.matrix th,table.matrix td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
  table.matrix thead th{background:var(--navy);color:#fff;font-weight:600;white-space:nowrap}
  table.matrix tbody th{background:#f6f7fb;font-weight:600;white-space:nowrap}
  table.matrix td.rec,table.matrix th.rec{background:#eafaf1}
  table.matrix thead th.rec{background:#1f9d61;color:#fff}
  table.matrix tbody tr:nth-child(even) td:not(.rec){background:#fafbfe}

  /* recommendation block */
  .recblock{background:#eefaf2;border:1px solid #bfe9cf;border-radius:10px;padding:1rem 1.1rem;margin-top:1rem}
  .recblock .rh{color:#1f9d61;font-weight:700;font-size:11px;letter-spacing:.1em}
  .recblock h3{font-size:18px;color:#0d6b3f;margin:.2rem 0 .5rem}
  .recblock ul{margin:.3rem 0;padding-left:1.1rem}
  .recblock .elim{color:var(--ink2);font-size:12px;margin-top:.5rem}

  /* decision impact grid */
  .impactgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
  .impactcell{border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;font-size:13px}
  .impactcell b{color:var(--accent)}

  /* decision explorer (dark panel) */
  .explorer{background:var(--navy);color:#cdd7ee;border-radius:10px;padding:1rem 1.1rem;margin-top:1.1rem}
  .explorer .eh{color:#fff;font-size:11px;letter-spacing:.16em;font-weight:700;margin-bottom:.7rem}
  .exprow{display:grid;grid-template-columns:150px 1fr;gap:.6rem;padding:.35rem 0;font-size:13px;border-top:1px solid #24304f}
  .exprow:first-of-type{border-top:0}
  .exprow .k{color:#8ea0c6}
  .chip.dark{background:#1e2947;border-color:#2c3a5f;color:#c9d5ef}
  .challenge{background:#ef8b2c;color:#fff;font-weight:700;margin-top:1rem}
  .challenge:hover{background:#e07d1d}
</style>
</head>
<body>
  <aside class="rail">
    <div class="brand">EDOS</div>
    <div class="brand-sub">ENGINEERING DECISION OS</div>
    <div class="row" style="margin-bottom:.6rem">
      <input id="newProj" placeholder="New project" onkeydown="if(event.key==='Enter')createProject()"/>
      <button onclick="createProject()">+</button>
    </div>
    <div id="projects" class="grow" style="overflow:auto"></div>
    <div class="muted" style="font-size:11px;margin-top:.6rem"><a href="/docs" target="_blank">API docs</a> · decision memory, not chat</div>
  </aside>

  <main class="main">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="brain"  onclick="tab('brain')">Project Brain</button>
      <button class="tab" data-tab="review" onclick="tab('review')">Engineering Review</button>
      <button class="tab" data-tab="deepdive" onclick="tab('deepdive')">Deep Dive</button>
      <button class="tab" data-tab="graph" onclick="tab('graph')">Decision Graph</button>
      <button class="tab" data-tab="execution" onclick="tab('execution')">Execution Context</button>
    </div>
    <div class="view" id="view"></div>
  </main>

<script>
const $=s=>document.querySelector(s);
let PID=null, PROJECTS=[], TAB='brain';

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok){let d;try{d=await r.json()}catch{d=await r.text()}throw new Error((d&&d.detail)||JSON.stringify(d)||r.status)}
  return r.status===204?null:r.json();
}
const esc=s=>(s??'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---- projects (left rail) ---- */
async function loadProjects(){
  PROJECTS=await api('/v1/projects');
  $('#projects').innerHTML=PROJECTS.map(p=>`
    <div class="proj ${p.id===PID?'active':''}" onclick="openProject('${p.id}')">
      <span class="nm">${esc(p.name)}</span>
      <button class="ghost sm" title="Delete" onclick="event.stopPropagation();delProject('${p.id}','${esc(p.name)}')">🗑</button>
    </div>`).join('')||'<div class="muted" style="font-size:12px">No projects yet</div>';
}
async function createProject(){
  const name=$('#newProj').value.trim(); if(!name)return;
  const p=await api('/v1/projects',{method:'POST',body:JSON.stringify({name})});
  $('#newProj').value=''; await loadProjects(); openProject(p.id);
}
async function delProject(id,name){
  if(!confirm(`Delete project "${name}" and all its data?`))return;
  await api(`/v1/projects/${id}`,{method:'DELETE'});
  if(PID===id)PID=null;
  await loadProjects(); render();
}
async function openProject(id){ PID=id; REVIEWTEXT=''; REVIEWFINDINGS=null; DD={topic:'',questions:null,answers:{},envelope:null,busy:false}; loadProjects(); tab('brain'); }

/* ---- tab routing ---- */
function tab(t){ TAB=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); render(); }
function render(){
  if(!PID){ $('#view').innerHTML='<div class="empty">Pick or create a project on the left to open its <b>Project Brain</b>.</div>'; return; }
  if(TAB==='brain') return renderBrain();
  if(TAB==='review') return renderReview();
  if(TAB==='deepdive') return renderDeepDive();
  $('#view').innerHTML=`<div class="card"><div class="eyebrow">${esc(TAB)}</div><div class="muted">This surface arrives in a later UI checkpoint (see BACKLOG-UI.md). The Project Brain + project management are live now.</div></div>`;
}

/* ---- UI-CP-1: Project Brain (live coverage + counts from GET /brain) ---- */
let COVDOMAIN=null; // when set, the coverage detail panel for that domain is shown

async function renderBrain(){
  COVDOMAIN=null;
  const p=PROJECTS.find(x=>x.id===PID)||{name:'Project'};
  let brain={coverage:0,coverage_by_domain:{},counts:{decisions:0,assumptions:0,contradictions:0,open_risks:0}};
  let items=0;
  try{ brain=await api(`/v1/projects/${PID}/brain`); }catch(e){ console.warn('brain',e); }
  try{ items=(await api(`/v1/projects/${PID}/items`)).length; }catch{}
  const c=brain.counts, cov=brain.coverage||0;
  const DOMAINS=['Architecture','Hardware','Firmware','Manufacturing','Testing','Certification'];
  $('#view').innerHTML=`
    <div class="brainbar"><span class="dot"></span> PROJECT BRAIN · ${esc(p.name)} <span class="grow"></span>
      <span class="muted" style="color:#9fb0d0;font-size:12px">${items} context items</span></div>
    <div class="brainbody">
      <div class="eyebrow">Coverage <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— how complete this project's engineering context is</span></div>
      <div class="covwrap"><div class="covtrack"><div class="covfill" style="width:${cov}%"></div></div><div class="covpct">${cov}%</div></div>
      <div class="tiles">
        <div class="tile"><div class="n">${c.decisions}</div><div class="l">Decisions</div></div>
        <div class="tile"><div class="n">${c.assumptions}</div><div class="l">Assumptions</div></div>
        <div class="tile"><div class="n">${c.contradictions}</div><div class="l">Contradictions</div></div>
        <div class="tile"><div class="n">${c.open_risks}</div><div class="l">Open Risks</div></div>
      </div>
      <div class="eyebrow">Decision coverage <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— click a domain to raise it</span></div>
      <div class="domains">
        ${DOMAINS.map(d=>{const v=brain.coverage_by_domain[d]||0;return `
          <div class="domain" style="cursor:pointer" onclick="openCoverage('${d}')" title="Answer questions / attach datasheets to raise ${d} coverage">
            <div class="top"><span>${d}</span><b>${v}%</b></div>
            <div class="dtrack"><div class="dfill" style="width:${v}%"></div></div>
          </div>`;}).join('')}
      </div>
      <div class="row" style="margin-top:1.2rem">
        <button onclick="tab('review')">Start Engineering Review</button>
        <button class="ghost" onclick="tab('deepdive')">Deep Dive</button>
      </div>
    </div>`;
}

/* ---- UI-CP-2: coverage detail panel for one domain (nudges + attach datasheet) ---- */
async function openCoverage(domain){
  COVDOMAIN=domain;
  let data;
  try{ data=await api(`/v1/projects/${PID}/coverage`); }catch(e){ alert('coverage: '+e.message); return; }
  const d=data.domains[domain]||{coverage:0,items:0,docs:0,unanswered:[],total_questions:0,answered:[]};
  const answered=(d.answered||[]).length;
  $('#view').innerHTML=`
    <div class="brainbar"><span class="dot"></span> COVERAGE · ${esc(domain)} <span class="grow"></span>
      <button class="ghost sm" onclick="renderBrain()">← Project Brain</button></div>
    <div class="brainbody">
      <div class="covwrap"><div class="covtrack"><div class="covfill" style="width:${d.coverage}%"></div></div><div class="covpct">${d.coverage}%</div></div>
      <div class="muted" style="margin-bottom:1rem">${d.items} context item(s) · ${d.docs} document(s) · ${answered}/${d.total_questions} questions answered. Nothing here is mandatory — each addition raises this domain's coverage.</div>

      <div class="eyebrow">Attach a datasheet / document</div>
      <div class="card" style="box-shadow:none">
        <textarea id="covdoc" rows="2" placeholder="Paste datasheet text, spec, or a reference for ${esc(domain)}…"></textarea>
        <div class="row" style="margin-top:.5rem;justify-content:flex-end">
          <button onclick="attachDoc('${domain}')">Attach document</button>
        </div>
      </div>

      <div class="eyebrow">Answer these to raise coverage</div>
      ${d.unanswered.length? d.unanswered.map(q=>`
        <div class="card" style="box-shadow:none">
          <div style="font-weight:600;margin-bottom:.4rem">${esc(q.q)}</div>
          <textarea id="q-${q.id}" rows="2" placeholder="Your answer…"></textarea>
          <div class="row" style="margin-top:.5rem;justify-content:flex-end">
            <button onclick="answerCoverage('${domain}','${q.id}')">Save answer</button>
          </div>
        </div>`).join('')
        : '<div class="muted" style="padding:.5rem">All question-set questions answered for this domain. 🎉</div>'}
    </div>`;
}

async function answerCoverage(domain,qid){
  const el=$(`#q-${qid}`); const answer=(el.value||'').trim();
  if(!answer){ el.focus(); return; }
  await api(`/v1/projects/${PID}/coverage/answer`,{method:'POST',
    body:JSON.stringify({domain,question_id:qid,answer})});
  openCoverage(domain); // re-fetch → this domain's % visibly rises
}

async function attachDoc(domain){
  const el=$('#covdoc'); const content=(el.value||'').trim();
  if(!content){ el.focus(); return; }
  await api(`/v1/projects/${PID}/items`,{method:'POST',
    body:JSON.stringify({item_type:'document',content,domain})});
  openCoverage(domain);
}

/* ---- UI-CP-3: Engineering Review → Findings ---- */
const CATLABEL={contradiction:'Contradiction',hidden_dependency:'Hidden Dependency',assumption:'Assumption',optimization:'Optimization',best_practice:'Best Practice'};
let REVIEWTEXT='', REVIEWFINDINGS=null, REVIEWBUSY=false;

function renderReview(){
  const findings=REVIEWFINDINGS;
  $('#view').innerHTML=`
    <div class="card">
      <div class="eyebrow">Engineering Review <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— a fast scan, no questions asked</span></div>
      <textarea id="revtext" rows="4" placeholder="Describe what you're working on… e.g. &quot;14S 100A BMS for an LFP pack in an EV — charging, discharging, cell balancing, CAN. Priority: safety, reliability, cost.&quot;">${esc(REVIEWTEXT)}</textarea>
      <div class="row" style="margin-top:.6rem;justify-content:flex-end">
        <button ${REVIEWBUSY?'disabled':''} onclick="runReview()">${REVIEWBUSY?'Scanning…':'Run Engineering Review'}</button>
      </div>
    </div>
    ${findings===null?'':renderFindings(findings)}`;
}

function renderFindings(findings){
  if(!findings.length) return `<div class="empty">No findings — either the input is very sparse or nothing tripped a rule, a stored decision, or an inferred assumption. Add more detail and re-run.</div>`;
  const cards=findings.map(f=>`
    <div class="finding ${f.category}">
      <div class="row wrap" style="margin-bottom:.5rem">
        <span class="cat ${f.category}">${esc(CATLABEL[f.category]||f.category)}</span>
        <span class="pill ${f.severity}">${esc(f.severity)}</span>
        <b>${esc(f.title)}</b>
      </div>
      <div>${esc(f.detail)}</div>
      ${(f.if_ignored&&f.if_ignored.length)?`
        <div class="ignore">
          <div class="h">IF YOU IGNORE THIS</div>
          <ul style="margin:.35rem 0 0;padding-left:1.1rem">${f.if_ignored.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        </div>`:''}
      ${(f.evidence&&f.evidence.length)?`<div style="margin-top:.5rem">${f.evidence.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}
    </div>`).join('');
  return `
    <div class="row" style="justify-content:space-between;margin:.2rem 0 .8rem">
      <div class="eyebrow" style="margin:0">${findings.length} finding${findings.length===1?'':'s'}</div>
      <button class="ghost sm" onclick="saveReview()">Save to Project Brain</button>
    </div>
    ${cards}`;
}

async function runReview(){
  REVIEWTEXT=($('#revtext').value||'').trim();
  if(!REVIEWTEXT){ $('#revtext').focus(); return; }
  REVIEWBUSY=true; renderReview();
  try{
    const r=await api(`/v1/projects/${PID}/review`,{method:'POST',body:JSON.stringify({text:REVIEWTEXT})});
    REVIEWFINDINGS=r.findings;
  }catch(e){ alert('review: '+e.message); }
  REVIEWBUSY=false; renderReview();
}

async function saveReview(){
  if(!REVIEWTEXT) return;
  try{
    await api(`/v1/projects/${PID}/review`,{method:'POST',body:JSON.stringify({text:REVIEWTEXT,save:true})});
    alert('Saved to Project Brain — this input is now project context (feeds coverage + counts).');
  }catch(e){ alert('save: '+e.message); }
}

/* ---- UI-CP-4: Deep Dive → Decision Card ---- */
let DD={topic:'',questions:null,answers:{},envelope:null,busy:false};

function renderDeepDive(){
  // preserve any in-progress topic/answers typed into the DOM before re-render
  const tEl=$('#ddtopic'); if(tEl) DD.topic=tEl.value;
  if(DD.questions) DD.questions.forEach(q=>{const a=$('#a-'+q.id); if(a) DD.answers[q.id]=a.value;});

  let html=`
    <div class="card">
      <div class="eyebrow">Deep Dive <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— targeted questions (each with a rationale), then a Decision Card</span></div>
      <textarea id="ddtopic" rows="2" placeholder="What decision are you diving into? e.g. &quot;Cell balancing strategy — passive vs active for 14S LFP&quot;">${esc(DD.topic)}</textarea>
      <div class="row" style="margin-top:.6rem;justify-content:flex-end">
        <button ${DD.busy?'disabled':''} onclick="ddAsk()">${DD.busy?'Thinking…':(DD.questions?'New topic':'Ask targeted questions')}</button>
      </div>
    </div>`;

  if(DD.questions){
    html+=`<div class="userinput"><div class="l">USER INPUT</div><div style="margin-top:.3rem">"${esc(DD.topic)}"</div></div>`;
    html+=DD.questions.map((q,i)=>`
      <div class="qcard">
        <div class="qh">Q${i+1} · ${esc(q.q)}</div>
        <div class="whybox"><div class="h">WHY AM I ASKING?</div><div class="t">${esc(q.why)}</div></div>
        <textarea id="a-${q.id}" rows="2" placeholder="Your answer…">${esc(DD.answers[q.id]||'')}</textarea>
      </div>`).join('');
    html+=`<div class="row" style="justify-content:flex-end;margin-bottom:1.1rem">
      <button ${DD.busy?'disabled':''} onclick="ddDecide()">${DD.busy?'Generating…':'Generate Decision'}</button></div>`;
  }
  if(DD.envelope) html+=renderDecisionCard(DD.envelope);
  $('#view').innerHTML=html;
}

async function ddAsk(){
  DD.topic=($('#ddtopic').value||'').trim();
  if(!DD.topic){ $('#ddtopic').focus(); return; }
  DD.busy=true; DD.questions=null; DD.answers={}; DD.envelope=null; renderDeepDive();
  try{
    const r=await api(`/v1/projects/${PID}/deepdive`,{method:'POST',body:JSON.stringify({topic:DD.topic})});
    DD.questions=r.questions;
  }catch(e){ alert('deep dive: '+e.message); }
  DD.busy=false; renderDeepDive();
}

async function ddDecide(){
  DD.questions.forEach(q=>{const a=$('#a-'+q.id); if(a) DD.answers[q.id]=a.value;});
  const answers=DD.questions.map(q=>({id:q.id,answer:(DD.answers[q.id]||'').trim()})).filter(a=>a.answer);
  DD.busy=true; renderDeepDive();
  try{
    DD.envelope=await api(`/v1/projects/${PID}/deepdive/decide`,{method:'POST',
      body:JSON.stringify({topic:DD.topic,answers})});
  }catch(e){ alert('decide: '+e.message); }
  DD.busy=false; renderDeepDive();
  const card=$('#deccard'); if(card) card.scrollIntoView({behavior:'smooth'});
}

function renderDecisionCard(env){
  const d=env.decision||{}, det=env.decision_detail||{};
  const st=(env.status||d.status||'recommended');
  const conf=Math.round((d.confidence||env.confidence||0)*100);
  const m=det.comparison_matrix||{criteria:[],options:[]};
  const rec=det.recommendation||{chosen:'',reasons:[],eliminated:[]};

  // comparison matrix
  let matrix='';
  if(m.options&&m.options.length){
    const head=m.options.map(o=>`<th class="${o.recommended?'rec':''}">${esc(o.name)}${o.recommended?' ★':''}</th>`).join('');
    const rows=(m.criteria||[]).map((c,ri)=>`
      <tr><th>${esc(c)}</th>${m.options.map(o=>`<td class="${o.recommended?'rec':''}">${esc((o.values||[])[ri]??'—')}</td>`).join('')}</tr>`).join('');
    matrix=`<div class="eyebrow" style="margin-top:.3rem">Comparison Matrix</div>
      <div class="matrixwrap"><table class="matrix"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // recommendation
  const recReasons=(rec.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join('');
  const elim=(rec.eliminated||[]).map(e=>`<b>${esc(e.option)}</b> eliminated: ${esc(e.reason)}`).join(' · ');
  const recBlock=`<div class="recblock">
      <div class="rh">◎ RECOMMENDATION</div>
      <h3>${esc(rec.chosen||d.summary||'')}</h3>
      <ul>${recReasons||'<li>'+esc(d.recommendation||'')+'</li>'}</ul>
      ${elim?`<div class="elim">${elim}</div>`:''}</div>`;

  // decision impact
  const impact=(det.decision_impact||[]).map(x=>`<div class="impactcell"><b>${esc(x.area)}:</b> ${esc(x.change)}</div>`).join('');
  const impactBlock=impact?`<div class="eyebrow" style="margin-top:1.1rem">Decision Impact — if this changes, what else changes?</div>
      <div class="impactgrid">${impact}</div>`:'';

  // risks & blind spots (reuse finding-style rows from the contract risks)
  const sevcat={critical:'contradiction',high:'hidden_dependency',medium:'assumption',low:'optimization'};
  const risks=(d.risks||[]).map(r=>`
    <div class="finding ${sevcat[r.severity]||'assumption'}">
      <div class="row wrap" style="margin-bottom:.3rem">
        <span class="pill ${r.severity}">${esc(r.severity)}</span><b>${esc(r.description)}</b>
      </div>
      ${r.mitigation?`<div class="muted" style="font-size:13px">Mitigation: ${esc(r.mitigation)}</div>`:''}
    </div>`).join('');
  const risksBlock=risks?`<div class="eyebrow" style="margin-top:1.1rem">Risks &amp; Blind Spots</div>${risks}`:'';

  // decision explorer (dark)
  const assumChips=(d.assumptions||[]).map(a=>`<span class="chip dark">${esc(a.statement)}</span>`).join('')||'<span class="muted">—</span>';
  const compChips=(det.impacted_components||[]).join(' · ')||'—';
  const related=(det.related_decisions||[]).filter(r=>r.id!==env.id).map(r=>`${esc(r.id)} (${esc(r.status)})`).join(', ')||'None';
  const deps=(det.dependencies||[]).length?det.dependencies.map(x=>esc(x)).join(' · '):'None (first decision)';
  const reviewConds=(det.review_conditions||[]).map(x=>esc(x)).join(' · ')||'—';
  const explorer=`<div class="explorer">
      <div class="eh">DECISION EXPLORER</div>
      <div class="exprow"><div class="k">Dependencies</div><div>${deps}</div></div>
      <div class="exprow"><div class="k">Related decisions</div><div>${related}</div></div>
      <div class="exprow"><div class="k">Assumptions</div><div>${assumChips}</div></div>
      <div class="exprow"><div class="k">Impacted components</div><div>${esc(compChips)}</div></div>
      <div class="exprow"><div class="k">Review conditions</div><div>${reviewConds}</div></div>
    </div>`;

  const accepted=(st==='accepted');
  const actions=`<div class="row" style="margin-top:1rem;gap:.6rem">
      <button ${accepted?'disabled':''} onclick="ddAccept('${env.id}')">${accepted?'✓ Accepted':'Accept Decision'}</button>
      <button class="challenge" onclick="alert('Challenge This Decision arrives in UI-CP-5 — it will argue the counter-case against the load-bearing assumption with a cost callout.')">⚡ Challenge This Decision</button>
    </div>
    <div class="muted" style="font-size:12px;margin-top:.5rem">Share: edos.dev/d/${esc(env.id)}</div>`;

  return `<div class="deccard" id="deccard">
    <div class="dechead">
      <div class="eye">DECISION CARD · ${esc(env.id)}</div>
      <h2>${esc(d.summary||det.recommendation?.chosen||'Decision')}</h2>
      <div class="meta"><span class="decstatus ${st}">${esc(st)}</span>
        <span>Coverage <b>${conf}%</b></span>
        ${det.missing?`<span class="missing">Missing: ${esc(det.missing)}</span>`:''}</div>
    </div>
    <div class="decbody">
      ${matrix}
      ${recBlock}
      ${impactBlock}
      ${risksBlock}
      ${explorer}
      ${actions}
    </div>
  </div>`;
}

async function ddAccept(id){
  try{
    await api(`/v1/decisions/${id}/accept`,{method:'POST',body:JSON.stringify({})});
    await api(`/v1/decisions/${id}/outcome`,{method:'POST',body:JSON.stringify({outcome:'accepted'})});
    DD.envelope=await api(`/v1/decisions/${id}`);
    renderDeepDive();
  }catch(e){ alert('accept: '+e.message); }
}

loadProjects().then(render);
</script>
