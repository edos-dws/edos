            <div class="pm-lbl">Deep dive in project</div>${menu}
            <div class="pm-item" onclick="goHome()" style="color:var(--accent)">＋ New project…</div>
          </div>
        </div>
        <button class="sendbtn" ${DD.busy?'disabled':''} title="Send (⌘/Ctrl+Enter)" onclick="ddAsk()">${DD.busy?'…':ICONS.send}</button>
      </div>
    </div>
    <div class="muted" style="font-size:11px;text-align:center;margin-top:.4rem">Context comes only from <b>${esc(cur.name)}</b> — projects stay isolated. ⌘/Ctrl+Enter to send.</div>
  </div>`;
}

function bubble(role,inner,lead){
  const av = role==='asst' ? ICONS.spark : 'You';
  return `<div class="msg ${role}"><div class="av">${av}</div><div class="bubble ${role==='asst'?'':''}">${lead?`<div class="b-lead">${esc(lead)}</div>`:''}${inner}</div></div>`;
}

function renderDeepDive(){
  if(DD.sessions===null) loadSessions();
  const tEl=$('#ddtopic'); if(tEl && !DD.questions && !DD.envelope) DD.topic=tEl.value;
  if(DD.questions) DD.questions.forEach(q=>{const a=$('#a-'+q.id); if(a) DD.answers[q.id]=a.value;});
  if(DD.followups) DD.followups.forEach(q=>{const a=$('#fa-'+q.id); if(a) DD.fuAnswers[q.id]=a.value;});
  const rEl=$('#reviseinput'); if(rEl) DD.reviseText=rEl.value;

  const cur=PROJECTS.find(p=>p.id===PID)||{name:'Project'};
  let thread='';

  // empty state — nothing started yet
  if(!DD.questions && !DD.envelope && !DD.busy){
    thread+=`<div class="msg asst"><div class="av">${ICONS.spark}</div><div class="bubble">
      <div class="b-lead">What decision are we working through?</div>
      Describe it below. I'll pull what <b>${esc(cur.name)}</b> already knows, ask only what's still missing, then produce a defensible Decision Card — with a comparison matrix, the assumptions it rests on, and the risks if you're wrong.
    </div></div>`;
  }

  // the user's topic as a user message
  if(DD.topic && (DD.questions||DD.busy)){
    thread+=bubble('user',esc(DD.topic));
  }

  // reasoning frame (spine + project-weighted lenses) — shown before questions/card so reasoning is visible
  if(DD.frame){
    thread+=`<div class="msg asst"><div class="av">${ICONS.spark}</div><div class="bubble wide">${renderFramePanel(DD.frame)}</div></div>`;
  }

  // questions as an assistant message
  if(DD.questions){
    let qinner='';
    if(DD.generatedBy==='heuristic'){
      qinner+=`<div class="ignore" style="border-color:var(--amber);background:#fbf1e3;margin-bottom:.7rem"><div class="h" style="color:#a5691a">⚠ LLM unavailable — template questions</div>
        <div style="margin-top:.2rem;font-size:13px">The live model isn't responding (no key or quota). These are generic fallbacks. Check <code>/health</code>.</div></div>`;
    }
    if(DD.skipped&&DD.skipped.length){
      qinner+=`<div class="skipped"><div class="sh">✓ Already known (skipped ${DD.skipped.length}) — ${esc(cur.name)} already answers:</div>
        <ul>${DD.skipped.map(s=>`<li><b>${esc(s.q)}</b> <span class="muted">— ${esc(s.reason)}</span></li>`).join('')}</ul></div>`;
    }
    if(!DD.questions.length){
      // Q2 zero-question path: no questions needed → confirm EDOS's understanding, then continue.
      qinner+=`<div class="confirmbox">
        <div class="cb-h">✓ No questions needed</div>
        <div class="cb-note">${esc(DD.note||'I have enough context on this topic.')}</div>
        <div class="cb-understanding"><span class="cb-lbl">My understanding</span>${esc(DD.understanding||('You\'re deciding: '+DD.topic))}</div>
        <div class="btnrow end" style="margin-top:.9rem">
          <button class="ghost" onclick="ddNewDecision()">No, let me rephrase</button>
          <button ${DD.busy?'disabled':''} onclick="ddDecide()">${DD.busy?'Generating…':'Agree & generate decision'}</button>
        </div></div>`;
    }else{
      qinner+=`<div style="margin-bottom:.5rem">I have <b>${DD.questions.length}</b> targeted question${DD.questions.length>1?'s':''}. Answer what you can — nothing is mandatory.</div>`;
      qinner+=DD.questions.map((q,i)=>`
        <div class="qcard">
          <div class="qh">Q${i+1} · ${esc(q.q)}</div>
          <div class="whybox"><div class="h">WHY AM I ASKING?</div><div class="t">${esc(q.why)}</div></div>
          <textarea id="a-${q.id}" rows="2" placeholder="Your answer…">${esc(DD.answers[q.id]||'')}</textarea>
        </div>`).join('');
      if(DD.followups&&DD.followups.length){
        qinner+=`<div class="fuhead">Based on your answers, one more:</div>`;
        qinner+=DD.followups.map((q,i)=>`
          <div class="qcard followup">
            <div class="qh">Follow-up ${i+1} · ${esc(q.q)}</div>
            <div class="whybox"><div class="h">WHY AM I ASKING?</div><div class="t">${esc(q.why)}</div></div>
            <textarea id="fa-${q.id}" rows="2" placeholder="Your answer…">${esc(DD.fuAnswers[q.id]||'')}</textarea>
          </div>`).join('');
      }
    }
    const primary = (!DD.questions.length)
      ? `<button ${DD.busy?'disabled':''} onclick="ddDecide()">${DD.busy?'Generating…':'Generate Decision'}</button>`
      : (DD.followups===null
          ? `<button ${DD.busy?'disabled':''} onclick="ddFollowup()">${DD.busy?'Checking…':'Continue'}</button>`
          : `<button ${DD.busy?'disabled':''} onclick="ddDecide()">${DD.busy?'Generating…':'Generate Decision'}</button>`);
    const skip = DD.questions.length? `<button class="ghost" ${DD.busy?'disabled':''} onclick="ddDecide()" title="Decide with what you have">Skip to decision</button>`:'';
    qinner+=`<div class="row" style="justify-content:flex-end;gap:.6rem;margin-top:.4rem">${skip}${primary}</div>`;
    thread+=`<div class="msg asst"><div class="av">${ICONS.spark}</div><div class="bubble wide">${qinner}</div></div>`;
  }

  // busy thinking indicator
  if(DD.busy){
    thread+=`<div class="msg asst"><div class="av">${ICONS.spark}</div><div class="bubble"><span class="thinking"><i></i><i></i><i></i> EDOS is reasoning…</span></div></div>`;
  }

  // the decision card as a wide assistant message
  if(DD.envelope){
    thread+=`<div class="msg asst"><div class="av">${ICONS.spark}</div><div class="bubble wide" style="padding:0;border:0;box-shadow:none;background:transparent">${renderDecisionCard(DD.envelope)}</div></div>`;
  }

  $('#view').innerHTML=`
    <div class="chatshell">
      <div class="chattop">
        <div class="ct-title">Deep Dive <small>· ${esc(cur.name)}</small></div>
        <div class="btnrow">
          <button class="ghost sm ct-hist ${DD.showHistory?'active':''}" title="Decision history" onclick="ddToggleHistory()">${ICONS.timeline}History</button>
          <button class="ghost" onclick="ddNewDecision()">＋ New decision</button>
        </div>
      </div>
      ${DD.showHistory
        ? renderHistoryPanel()
        : `<div class="chatthread" id="chatthread">${thread}</div>${renderComposer()}`}
    </div>`;
  const ta=$('#ddtopic'); if(ta){ autoGrow(ta); }
  if(DD.envelope) loadResearchWorkspace(DD.envelope.id);
  pushURL();  // reflect the loaded/created decision id in the URL
  // keep the newest message in view
  const th=$('#chatthread'); if(th && (DD.busy||DD.envelope)) th.scrollIntoView({block:'end'});
}

// reasoning-first FRAME: EDOS reflects back the project direction (spine) and the lenses it will weigh for
// THIS decision, so the reasoning is visible and the engineer can see the emphasis before any card.
function renderFramePanel(fr){
  const spine=(fr.spine||[]).filter(s=>!s.startsWith('unknown')).map(s=>{
    const [k,v]=s.split(':'); return `<span class="spinechip"><b>${esc((k||'').trim())}</b> ${esc((v||'').trim())}</span>`;
  }).join('');
  const lenses=(fr.lenses||[]);
  const deep=lenses.filter(l=>l.deep).slice(0,6).map(l=>`
    <div class="lensrow deep" title="${esc(l.reason||'')}"><span class="lw">${Math.round((l.weight||0)*100)}</span><b>${esc(l.title)}</b></div>`).join('');
  const scan=lenses.filter(l=>!l.deep).slice(0,6).map(l=>`<span class="lenschip" title="${esc(l.reason||'')}">${esc(l.title.split('(')[0].trim())}</span>`).join('');
  const asks=(fr.framing_questions||[]).map(q=>esc(q.q)).join(' · ');
  return `<div class="framepanel">
    <div class="fp-h">◇ HOW I'M FRAMING THIS</div>
    ${fr.understanding?`<div class="fp-u">${esc(fr.understanding)}</div>`:''}
    ${spine?`<div class="fp-lbl">Project direction</div><div class="spinewrap">${spine}</div>`:''}
    ${deep?`<div class="fp-lbl">I'll reason hardest about</div><div class="lenswrap">${deep}</div>`:''}
    ${scan?`<div class="fp-lbl">Also scanning for blind spots</div><div class="scanwrap">${scan}</div>`:''}
    ${asks?`<div class="fp-lbl">To sharpen the frame I still need</div><div class="fp-asks">${asks}</div>`:''}
  </div>`;
}

function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,180)+'px'; }
function toggleProjMenu(e){ if(e) e.stopPropagation(); const m=$('#projmenu'); if(m) m.classList.toggle('open'); }
async function switchProject(id){ const m=$('#projmenu'); if(m) m.classList.remove('open'); if(id!==PID){ await openProject(id,'deepdive'); } }
document.addEventListener('click',e=>{
  const pm=$('#projmenu'); if(pm&&pm.classList.contains('open')&&!e.target.closest('.projsel-wrap')) pm.classList.remove('open');
  const nm=$('#navmenu'); if(nm&&nm.classList.contains('open')&&!e.target.closest('.navproj-wrap')) nm.classList.remove('open');
});

async function ddAsk(){
  DD.topic=($('#ddtopic').value||'').trim();
  if(!DD.topic){ $('#ddtopic').focus(); return; }
  DD.busy=true; DD.questions=null; DD.skipped=[]; DD.note=''; DD.answers={}; DD.followups=null; DD.fuAnswers={}; DD.envelope=null; DD.frame=null; renderDeepDive();
  try{
    // reasoning-first: fetch the questions AND the reasoning frame (spine + weighted lenses) together, so
    // the engineer sees HOW EDOS is framing this decision before any card — the card is the closing move.
    const [r,fr]=await Promise.all([
      api(`/v1/projects/${PID}/deepdive`,{method:'POST',body:JSON.stringify({topic:DD.topic})}),
      api(`/v1/projects/${PID}/deepdive/frame`,{method:'POST',body:JSON.stringify({topic:DD.topic})}).catch(()=>null)
    ]);
    DD.questions=r.questions; DD.skipped=r.skipped||[]; DD.note=r.note||''; DD.generatedBy=r.generated_by||''; DD.understanding=r.understanding||'';
    DD.frame=fr;
  }catch(e){ toast('deep dive: '+e.message,'error'); }
  DD.busy=false; renderDeepDive();
}

function ddCollectAnswers(){
  DD.questions.forEach(q=>{const a=$('#a-'+q.id); if(a) DD.answers[q.id]=a.value;});
  if(DD.followups) DD.followups.forEach(q=>{const a=$('#fa-'+q.id); if(a) DD.fuAnswers[q.id]=a.value;});
  const base=DD.questions.map(q=>({id:q.id,q:q.q,answer:(DD.answers[q.id]||'').trim()})).filter(a=>a.answer);
  const fu=(DD.followups||[]).map(q=>({id:q.id,q:q.q,answer:(DD.fuAnswers[q.id]||'').trim()})).filter(a=>a.answer);
  return base.concat(fu);
}

// UI-CP-11: after the batch, ask the backend for 0–2 targeted follow-ups. Empty → go straight to decide.
async function ddFollowup(){
  const answers=ddCollectAnswers();
  DD.busy=true; renderDeepDive();
  try{
    const r=await api(`/v1/projects/${PID}/deepdive/followup`,{method:'POST',
      body:JSON.stringify({topic:DD.topic,answers})});
    DD.followups=r.questions||[];
    DD.busy=false;
    if(!DD.followups.length){ return ddDecide(); }  // nothing warranted → decide now
    renderDeepDive();
  }catch(e){ DD.busy=false; DD.followups=[]; toast('follow-up: '+e.message,'error'); renderDeepDive(); }
}

async function ddDecide(){
  const answers=ddCollectAnswers();
  DD.busy=true; renderDeepDive();
  try{
    DD.envelope=await api(`/v1/projects/${PID}/deepdive/decide`,{method:'POST',
      body:JSON.stringify({topic:DD.topic,answers})});
    try{ DD.assumptions=await api(`/v1/projects/${PID}/assumptions`); }catch{}
    loadSessions();  // a new decision becomes a new session in the list
  }catch(e){ toast('decide: '+e.message,'error'); }
  DD.busy=false; renderDeepDive();
  const card=$('#deccard'); if(card) card.scrollIntoView({behavior:'smooth'});
}

function renderDecisionCard(env){
  const d=env.decision||{}, det=env.decision_detail||{};
  const st=(env.status||d.status||'recommended');
  const conf=Math.round((d.confidence||env.confidence||0)*100);
  const m=det.comparison_matrix||{criteria:[],options:[]};
  const rec=det.recommendation||{chosen:'',reasons:[],eliminated:[]};

  // comparison matrix
  let matrix='';
  if(m.options&&m.options.length){
    const head=m.options.map(o=>`<th class="${o.recommended?'rec':''}">${esc(o.name)}${o.recommended?' ★':''}</th>`).join('');
    const rows=(m.criteria||[]).map((c,ri)=>`
      <tr><th>${esc(c)}</th>${m.options.map(o=>`<td class="${o.recommended?'rec':''}">${esc((o.values||[])[ri]??'—')}</td>`).join('')}</tr>`).join('');
    matrix=`<div class="eyebrow" style="margin-top:.3rem">Comparison Matrix</div>
      <div class="matrixwrap"><table class="matrix"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // recommendation
  const recReasons=(rec.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join('');
  const elim=(rec.eliminated||[]).map(e=>`<b>${esc(e.option)}</b> eliminated: ${esc(e.reason)}`).join(' · ');
  const recBlock=`<div class="recblock">
      <div class="rh">◎ RECOMMENDATION</div>
      <h3>${esc(rec.chosen||d.summary||'')}</h3>
      <ul>${recReasons||'<li>'+esc(d.recommendation||'')+'</li>'}</ul>
      ${elim?`<div class="elim">${elim}</div>`:''}</div>`;

  // runner-up — the #2 option it beat, how narrow, and what tipped it (show the line, not a lone verdict)
  const ru=det.runner_up;
  const runnerBlock=(ru&&ru.option)?`<div class="runnerup">
      <span class="rulabel">Runner-up</span> <b>${esc(ru.option)}</b>
      <span class="rugap ${esc(ru.gap||'')}">${esc(ru.gap||'')} gap</span>
      ${(ru.tipped_by&&ru.tipped_by.length)?`<div class="rutip">Tipped by: ${ru.tipped_by.map(esc).join(' · ')}</div>`:''}
    </div>`:'';

  // decision impact
  // computed checks (#8): EDOS re-evaluated the model's own arithmetic — ✓ verified, ✗ mismatch, ○ unchecked
  const comps=(det.computations||[]).map(c=>{
    const badge=c.verified===true?'<span class="ck ok">✓</span>':c.verified===false?'<span class="ck bad">✗</span>':'<span class="ck na">○</span>';
    const mism=(c.verified===false)?` <span class="ckmis">stated ${esc(c.claimed)}, computes ${esc(c.computed)}</span>`:'';
    return `<div class="comprow">${badge}<span class="cq">${esc(c.quantity||'')}</span><code>${esc(c.expression||'')}</code>${(c.computed!=null)?` = <b>${esc(c.computed)}</b>`:''}${mism}</div>`;
  }).join('');
  const compBlock=comps?`<div class="eyebrow" style="margin-top:1.1rem">Computed checks — EDOS re-verified the arithmetic</div><div class="compwrap">${comps}</div>`:'';

  const impact=(det.decision_impact||[]).map(x=>`<div class="impactcell"><b>${esc(x.area)}:</b> ${esc(x.change)}</div>`).join('');
  const impactBlock=impact?`<div class="eyebrow" style="margin-top:1.1rem">Decision Impact — if this changes, what else changes?</div>
      <div class="impactgrid">${impact}</div>`:'';

  // risks & blind spots (reuse finding-style rows from the contract risks)
  const sevcat={critical:'contradiction',high:'hidden_dependency',medium:'assumption',low:'optimization'};
  const risks=(d.risks||[]).map(r=>`
    <div class="finding ${sevcat[r.severity]||'assumption'}">
      <div class="row wrap" style="margin-bottom:.3rem">
        <span class="pill ${r.severity}">${esc(r.severity)}</span><b>${esc(r.description)}</b>
      </div>
      ${r.mitigation?`<div class="muted" style="font-size:13px">Mitigation: ${esc(r.mitigation)}</div>`:''}
    </div>`).join('');
  const risksBlock=risks?`<div class="eyebrow" style="margin-top:1.1rem">Risks — how the chosen path can fail</div>${risks}`:'';

  // blind spots — DISTINCT from risks: what the question itself didn't ask (outside its frame)
  const blind=(det.blind_spots||[]).map(b=>`
    <div class="finding hidden_dependency">
      <div class="row wrap" style="margin-bottom:.3rem"><span class="pill high">blind spot</span><b>${esc(b.description||'')}</b></div>
      ${b.why_it_matters?`<div class="muted" style="font-size:13px">Why it matters: ${esc(b.why_it_matters)}</div>`:''}
    </div>`).join('');
  const blindBlock=blind?`<div class="eyebrow" style="margin-top:1.1rem">Blind Spots — what the question didn't ask</div>${blind}`:'';

  // decision explorer (dark)
  // UI-CP-6: render assumptions as first-class status chips (match by source decision or statement).
  const fc=(DD.assumptions||[]).filter(a=>a.source_decision_id===env.id);
  const byStmt={}; (DD.assumptions||[]).forEach(a=>{byStmt[(a.statement||'').trim().toLowerCase()]=a;});
  const assumChips=(d.assumptions||[]).map(a=>{
    const m=byStmt[(a.statement||'').trim().toLowerCase()];
    const st=m?m.status:'created'; const aid=m?`<span class="aid">${esc(m.id)}</span>`:'';
    return `<span class="achip dark ${st}" title="${esc(ASLABEL[st]||st)}">${aid}${esc(a.statement)}</span>`;
  }).join('') || fc.map(a=>`<span class="achip dark ${a.status}"><span class="aid">${esc(a.id)}</span>${esc(a.statement)}</span>`).join('');
  const compChips=(det.impacted_components||[]).join(' · ');
  const related=(det.related_decisions||[]).filter(r=>r.id!==env.id).map(r=>`${esc(r.id)} (${esc(r.status)})`).join(', ');
  const deps=(det.dependencies||[]).length?det.dependencies.map(x=>esc(x)).join(' · '):'';
  const reviewConds=(det.review_conditions||[]).map(x=>esc(x)).join(' · ');
  // Only rows with real content are shown — nothing is padded with "—" / "None".
  const exprow=(k,v)=>v?`<div class="exprow"><div class="k">${k}</div><div>${v}</div></div>`:'';
  const exBody=exprow('Dependencies',deps)+exprow('Related decisions',related)+exprow('Assumptions',assumChips)
    +exprow('Impacted components',esc(compChips))+exprow('Tripwires — what would change this',reviewConds);
  const explorer=exBody?`<div class="explorer"><div class="eh">DECISION EXPLORER</div>${exBody}</div>`:'';

  const accepted=(st==='accepted');
  const actions=`<div class="row" style="margin-top:1rem;gap:.6rem">
      <button ${accepted?'disabled':''} onclick="ddAccept('${env.id}')">${accepted?'✓ Accepted':'Accept Decision'}</button>
      <button class="challenge" ${DD.revising?'disabled':''} onclick="ddToggleRevise()">✎ Revise Decision</button>
    </div>
    ${renderRevise(env.id)}
    <div class="muted" style="font-size:12px;margin-top:.5rem">Share: edos.dev/d/${esc(env.id)}</div>`;

  return `<div class="deccard" id="deccard">
    <div class="dechead">
      <div class="eye">DECISION CARD · ${esc(env.id)} · v${env.version||1}</div>
      <h2>${esc(d.summary||det.recommendation?.chosen||'Decision')}</h2>
      <div class="meta"><span class="decstatus ${st}">${esc(st)}</span>
        <span>Coverage <b>${conf}%</b></span>
        ${(env.version>1)?`<span class="muted">revised · v${env.version}</span>`:''}
        ${det.missing?`<span class="missing">Missing: ${esc(det.missing)}</span>`:''}</div>
    </div>
    <div class="decbody">
      ${matrix}
      ${recBlock}
      ${runnerBlock}
      ${compBlock}
      ${impactBlock}
      ${risksBlock}
      ${blindBlock}
      ${explorer}
      <div id="rw-${esc(env.id)}" class="rw-slot"></div>
      ${actions}
    </div>
  </div>`;
}

/* ---- UI-CP-10: Research Workspace panel (sources referenced by this decision, PDF p7) ---- */
async function loadResearchWorkspace(id){
  const slot=document.getElementById('rw-'+id); if(!slot) return;
  let rw;
  try{ rw=await api(`/v1/decisions/${id}/sources`); }catch{ return; }
  const docs=rw.documents||[], ev=rw.evidence||[];
  if(!docs.length && !ev.length){
    slot.innerHTML=`<div class="rw"><div class="rwh">Research Workspace — sources referenced</div>
      <div class="muted" style="font-size:13px">No datasheets or evidence sources linked yet. Attach a datasheet (Project Brain → domain) or ground the decision with evidence.</div></div>`;
    return;
  }
  const trunc=(s,n)=>{s=(s||'').toString();return s.length>n?s.slice(0,n-1)+'…':s;};
  const docRows=docs.map(d=>`<div class="rwdoc"><span class="rwtag">doc</span>
    <div><b>${esc(trunc(d.content,120))}</b>${d.domain?` <span class="chip">${esc(d.domain)}</span>`:''}</div></div>`).join('')
    || '<div class="muted" style="font-size:13px">No document/datasheet items in this project.</div>';
  const evChips=ev.map(e=>`<span class="rwsrc" title="${esc(e.claim||'')}"><span class="rwtag ext">${esc(e.kind||'src')}</span> ${refLink(e.source,e.url)}</span>`).join('')
    || '<span class="muted" style="font-size:13px">No evidence sources cited.</span>';
  slot.innerHTML=`<div class="rw">
    <div class="rwh">Research Workspace — sources referenced by ${esc(id)}</div>
    <div style="font-size:11px;letter-spacing:.08em;color:var(--ink2);font-weight:700;margin:.2rem 0 .3rem">DATASHEETS / DOCUMENTS</div>
    ${docRows}
    <div style="font-size:11px;letter-spacing:.08em;color:var(--ink2);font-weight:700;margin:.7rem 0 .3rem">EVIDENCE SOURCES</div>
    <div>${evChips}</div>
  </div>`;
}

async function ddAccept(id){
  try{
    await api(`/v1/decisions/${id}/accept`,{method:'POST',body:JSON.stringify({})});
    await api(`/v1/decisions/${id}/outcome`,{method:'POST',body:JSON.stringify({outcome:'accepted'})});
    DD.envelope=await api(`/v1/decisions/${id}`);
    try{ DD.assumptions=await api(`/v1/projects/${PID}/assumptions`); }catch{}
    renderDeepDive();
  }catch(e){ toast('accept: '+e.message,'error'); }
}

/* ---- Revise Decision (re-evaluate → new version) ---- */
function renderRevise(id){
  if(!DD.reviseOpen) return '';
  return `<div class="challengecard">
    <div class="ch-head">
      <div class="eye">✎ REVISE — RE-EVALUATE THIS DECISION WITH NEW INPUT</div>
      <h3>What should EDOS update or clarify?</h3>
      <div class="muted" style="font-size:13px;margin-top:.2rem">Add a constraint, tighten a target, or correct a premise. EDOS re-reasons and produces a new, sharper <b>version</b> of this decision — the previous version stays in history.</div>
    </div>
    <div style="padding:0 1.2rem 1.1rem">
      <textarea id="reviseinput" rows="3" placeholder="e.g. &quot;Peak current is actually 250A, not 200A&quot; · &quot;Cost target moved to under $1.50&quot; · &quot;Must also pass CISPR 25 class 5&quot;" ${DD.revising?'disabled':''}>${esc(DD.reviseText||'')}</textarea>
      <div class="row" style="justify-content:flex-end;gap:.6rem;margin-top:.6rem">
        <button class="ghost" ${DD.revising?'disabled':''} onclick="ddToggleRevise()">Cancel</button>
        <button ${DD.revising?'disabled':''} onclick="ddRevise('${id}')">${DD.revising?'Re-evaluating…':'Revise & re-evaluate'}</button>
      </div>
    </div>
  </div>`;
}

function ddToggleRevise(){
  const ta=$('#reviseinput'); if(ta) DD.reviseText=ta.value;
  DD.reviseOpen=!DD.reviseOpen; renderDeepDive();
  const ta2=$('#reviseinput'); if(ta2) ta2.focus();
}

async function ddRevise(id){
  const ta=$('#reviseinput'); const instruction=((ta&&ta.value)||DD.reviseText||'').trim();
  if(!instruction){ if(ta) ta.focus(); return; }
  DD.revising=true; DD.reviseText=instruction; renderDeepDive();
  try{
    DD.envelope=await api(`/v1/decisions/${id}/revise`,{method:'POST',
      body:JSON.stringify({instruction})});
    DD.reviseOpen=false; DD.reviseText='';
    try{ DD.assumptions=await api(`/v1/projects/${PID}/assumptions`); }catch{}
    loadSessions();  // refresh the session list (version bump)
  }catch(e){ toast('revise: '+e.message,'error'); }
  DD.revising=false; renderDeepDive();
  const card=$('#deccard'); if(card) card.scrollIntoView({behavior:'smooth'});
}

/* ---- UI-CP-7: Decision Graph + Cross-Contradiction + Diff ---- */
let GRAPH={data:null,contradictions:null,decisions:null,diff:null,diffId:'',busy:false};

async function renderGraph(){
  $('#view').innerHTML=`<div class="card"><div class="eyebrow">Decision Graph</div><div class="muted">Loading the decision web…</div></div>`;
  try{
    const [g,con,decs]=await Promise.all([
      api(`/v1/projects/${PID}/graph`),
      api(`/v1/projects/${PID}/contradictions`),
      api(`/v1/projects/${PID}/decisions`),
    ]);
    GRAPH.data=g; GRAPH.contradictions=con; GRAPH.decisions=decs;
  }catch(e){ $('#view').innerHTML=`<div class="empty">graph: ${esc(e.message)}</div>`; return; }
  paintGraph();
}

function paintGraph(){
  const g=GRAPH.data||{nodes:[],edges:[]};
  const svg=g.nodes.length?graphSVG(g):`<div class="empty" style="color:#a09d96">No decisions or assumptions yet. Persist a decision (Deep Dive) — its nodes and their relationships appear here.</div>`;
  const legend=`<div class="glegend">
    <span class="k"><span class="sw" style="background:#cc785c"></span> Decision</span>
    <span class="k"><span class="sw" style="background:#f5f0e8;border:1px solid #b8b2a6"></span> Assumption</span>
    <span class="k"><span class="sw" style="background:#f5f0e8;border:1px dashed #a5231f"></span> Challenged / invalidated</span>
    <span class="k"><span class="sw" style="background:#e5484d"></span> Conflict edge</span></div>`;

  const cons=GRAPH.contradictions||[];
  const conCards=cons.length? cons.map(c=>`
    <div class="finding contradiction">
      <div class="row wrap" style="margin-bottom:.4rem">
        <span class="cat contradiction">Cross-Decision Contradiction</span>
        <span class="pill high">conflict</span>
        <b>${esc(c.a_label)} ⇄ ${esc(c.b_label)}</b>
      </div>
      <div>${esc(c.explanation)}</div>
      <div class="row wrap" style="margin-top:.6rem;justify-content:space-between">
        <div><span class="chip">${esc(c.a_type)} ${esc(c.a)}</span><span class="chip">${esc(c.b_type)} ${esc(c.b)}</span></div>
        <button class="ghost sm" onclick="resolveConflict('${esc(c.a)}','${esc(c.b)}')">Resolve conflict</button>
      </div>
    </div>`).join('')
    : `<div class="muted" style="padding:.4rem">No cross-decision contradictions. When two decisions are linked by a <code>conflicts_with</code> edge they surface here.</div>`;

  const versioned=(GRAPH.decisions||[]).filter(d=>d.version>1);
  const options=versioned.map(d=>`<option value="${esc(d.id)}" ${d.id===GRAPH.diffId?'selected':''}>${esc((d.decision&&d.decision.summary)||d.id)} · v${d.version}</option>`).join('');
  const diffPicker=versioned.length?`
    <div class="row" style="gap:.6rem;margin-bottom:.6rem">
      <select id="diffsel" onchange="loadDiff(this.value)" style="max-width:420px">
        <option value="">Pick a decision with &gt;1 version…</option>${options}
      </select>
    </div>${GRAPH.diff?renderDiff(GRAPH.diff):''}`
    : `<div class="muted" style="padding:.4rem">No decision has more than one version yet. Accept or edit a decision to create a new version, then its diff (struck-through old → new, why changed, affected) shows here.</div>`;

  $('#view').innerHTML=`
    <div class="page">
      ${pageHead('Decision Graph','How the decisions connect',
        'The web of decisions and the assumptions they rest on. Coral nodes are decisions; cream nodes are assumptions (dashed = challenged or invalidated); red edges mark conflicts.')}
      <div class="card">
        <div class="graphwrap">${svg}</div>
        ${legend}
      </div>
      <div class="section-label" style="font-size:22px;margin:2rem 0 .2rem">Cross-decision contradictions</div>
      <div class="section-note">When two decisions are linked by a <code>conflicts_with</code> edge, the clash surfaces here.</div>
      <div class="card">${conCards}</div>
      <div class="section-label" style="font-size:22px;margin:2rem 0 .2rem">Decision diff</div>
      <div class="section-note">What changed between two versions of a decision — struck-through old → new, why it changed, and what it affects.</div>
      <div class="card">${diffPicker}</div>
    </div>`;
}

function graphSVG(g){
  const dec=g.nodes.filter(n=>n.type==='decision');
  const asm=g.nodes.filter(n=>n.type==='assumption');
  const DW=158,DH=54,AW=132,AH=42, decY=64, asmY=300;
  const cols=Math.max(dec.length,asm.length,1);
  const colW=Math.max(190, 900/cols);
  const W=Math.max(680, cols*colW), H=380;
  const pos={};
  dec.forEach((n,i)=>{pos[n.id]={x:(i+0.5)*(W/Math.max(dec.length,1)),y:decY+DH/2,w:DW,h:DH,n};});
  asm.forEach((n,i)=>{pos[n.id]={x:(i+0.5)*(W/Math.max(asm.length,1)),y:asmY+AH/2,w:AW,h:AH,n};});

  // ---- edges first (under nodes) ----
  const edgeSVG=(g.edges||[]).map(e=>{
    const s=pos[e.source], t=pos[e.target]; if(!s||!t) return '';
    const conflict=e.conflict;
    const sameBand=Math.abs(s.y-t.y)<6;
    const col=conflict?'#e5484d':'#8e8b82';
    let d, mx, my;
    if(sameBand){ // bow above the band so decision↔decision edges don't overlap the row
      const dir=(s.y<200)?-1:1; const lift=54;
      const cx=(s.x+t.x)/2, cy=s.y+dir*lift;
      const sx=s.x, sy=s.y+dir*(s.h/2), tx=t.x, ty=t.y+dir*(t.h/2);
      d=`M ${sx} ${sy} Q ${cx} ${cy} ${tx} ${ty}`; mx=cx; my=cy+dir*4;
    }else{ // cross-band (assumption→decision): stop at box edges
      const sy=s.y-s.h/2, ty=t.y+t.h/2;
      d=`M ${s.x} ${sy} L ${t.x} ${ty}`; mx=(s.x+t.x)/2; my=(sy+ty)/2;
    }
    const marker=conflict?'':`marker-end="url(#arrow)"`;
    const dash=conflict?'stroke-dasharray="6 4"':'';
    const lbl=conflict?'conflicts_with':e.relation;
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${conflict?2.2:1.6}" ${dash} ${marker} opacity="${conflict?.95:.7}"/>
      <rect x="${mx-lbl.length*3-4}" y="${my-9}" width="${lbl.length*6+8}" height="15" rx="4" fill="#181715" opacity=".85"/>
      <text class="e-label ${conflict?'conflict':''}" x="${mx}" y="${my+2}" text-anchor="middle">${esc(lbl)}</text>`;
  }).join('');

  // ---- nodes on top ----
  const trunc=(s,n)=>{s=(s||'').toString();return s.length>n?s.slice(0,n-1)+'…':s;};
  const decSVG=dec.map(n=>{
    const p=pos[n.id]; const conflicted=n.validity==='conflicted';
    const fill=conflicted?'#7a2b3a':'#cc785c';
    const stroke=conflicted?'#e5484d':'#cc785c';
    return `<g>
      <rect x="${p.x-p.w/2}" y="${p.y-p.h/2}" width="${p.w}" height="${p.h}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="${conflicted?2.5:1.5}"/>
      <text class="n-label" x="${p.x}" y="${p.y-4}" text-anchor="middle">${esc(trunc(n.label,20))}</text>
      <text class="e-label" x="${p.x}" y="${p.y+11}" text-anchor="middle" fill="#cfc9bd">${esc(n.id)} · ${esc(n.status)}</text>
    </g>`;
  }).join('');
  const asmSVG=asm.map(n=>{
    const p=pos[n.id]; const shaky=n.validity==='invalid';
    const stroke=shaky?'#a5231f':'#b8b2a6';
    return `<g>
      <rect x="${p.x-p.w/2}" y="${p.y-p.h/2}" width="${p.w}" height="${p.h}" rx="9" fill="#f5f0e8" stroke="${stroke}" stroke-width="1.6" ${shaky?'stroke-dasharray="6 4"':''}/>
      <text class="n-label dark" x="${p.x}" y="${p.y-3}" text-anchor="middle" fill="#2c2a26">${esc(trunc(n.label,22))}</text>
      <text class="e-label" x="${p.x}" y="${p.y+11}" text-anchor="middle" fill="#8e8b82">${esc(n.id)} · ${esc(n.status)}</text>
    </g>`;
  }).join('');

  return `<svg class="graph" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8e8b82"/></marker></defs>
    ${edgeSVG}${decSVG}${asmSVG}
  </svg>`;
}

async function resolveConflict(a,b){
  if(!await confirmBox({title:'Mark conflict resolved?',message:'This cross-decision conflict will be marked resolved and the conflicts_with edge closed.',confirmLabel:'Mark resolved'}))return;
  try{ await api('/v1/conflicts/resolve',{method:'POST',body:JSON.stringify({node_a:a,node_b:b})}); }
  catch(e){ toast('resolve: '+e.message,'error'); return; }
  renderGraph();  // re-fetch graph + contradictions so the resolved pair drops off
}
async function loadDiff(id){
  GRAPH.diffId=id; GRAPH.diff=null;
  if(!id){ paintGraph(); return; }
  try{ GRAPH.diff=await api(`/v1/decisions/${id}/diff`); }catch(e){ toast('diff: '+e.message,'error'); }
  paintGraph();
}

function renderDiff(df){
  const why=(df.why_changed||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="muted">No material change detected between these versions.</li>';
  const aff=(df.affected||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'<span class="muted">—</span>';
  const oldSumm=df.from_summary!=null?`<span class="old">${esc(df.from_summary)}</span><span class="arw">→</span>`:'';
  return `<div class="diffcard">
    <div class="diffhead">Decision Diff
      <span class="vtag">v${df.from_version==null?'—':df.from_version} → v${df.to_version}</span></div>
    <div class="diffbody">
      <div class="diff-summ">${oldSumm}<span class="new">${esc(df.to_summary||'')}</span></div>
      <div class="diffcols">
        <div class="whyc"><div class="h">Why changed?</div><ul>${why}</ul></div>
        <div class="affc"><div class="h">Affected</div><div>${aff}</div></div>
      </div>
    </div>
  </div>`;
}

/* ---- UI-CP-10: Timeline / Replay + Certification Matrix (PDF p23, p8) ---- */
async function renderTimeline(){
  $('#view').innerHTML=`<div class="card"><div class="eyebrow">Timeline</div><div class="muted">Replaying the project history…</div></div>`;
  let tl,cm;
  try{
    [tl,cm]=await Promise.all([
      api(`/v1/projects/${PID}/timeline`),
      api(`/v1/projects/${PID}/cert-matrix`),
    ]);
  }catch(e){ $('#view').innerHTML=`<div class="empty">timeline: ${esc(e.message)}</div>`; return; }

  const fmt=iso=>{ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?esc(iso):d.toISOString().slice(0,16).replace('T',' '); };
  const evs=tl.events||[];
  const rail=evs.length? `<div class="tl">${evs.map(e=>`
    <div class="tlev">
      <span class="tldot ${esc(e.kind)}"></span>
      <div class="tlmeta">
        <span class="tlkind ${esc(e.kind)}">${esc((e.kind||'').replace('_',' '))}</span>
        <span class="tldate">${fmt(e.when)}</span>
        ${e.coverage!=null?`<span class="tlcov">coverage ${e.coverage}%</span>`:''}
      </div>
      <div class="tllabel">${esc(e.label)}</div>
    </div>`).join('')}</div>`
    : `<div class="muted" style="padding:.4rem">No events yet. Add context, run a Deep Dive, or answer coverage questions — the project's history (with coverage growth) replays here.</div>`;

  // certification matrix
  const regions=cm.regions||[];
  const stds=cm.standards||[];
  const anyCost=stds.some(s=>s.cost), anyTime=stds.some(s=>s.timeline);
  let cmBody;
  if(!stds.length){
    cmBody=`<div class="empty" style="text-align:left">No standards detected yet. Mention standards (e.g. ISO 26262, AIS 156, ECE R100, UN 38.3) in decisions or reviews to generate the certification matrix.</div>`;
  }else{
    const head=`<tr><th>Standard</th>${regions.map(r=>`<th class="rec">${esc(r)}</th>`).join('')}${anyCost?'<th>Cost</th>':''}${anyTime?'<th>Timeline</th>':''}<th>Total</th></tr>`;
    const rows=stds.map(s=>{
      const set=new Set(s.regions||[]);
      const cells=regions.map(r=>set.has(r)?`<td class="reg yes">✓</td>`:`<td class="reg no">—</td>`).join('');
      const cost=anyCost?`<td>${s.cost?esc(s.cost):'<span class="muted">—</span>'}</td>`:'';
      const time=anyTime?`<td>${s.timeline?esc(s.timeline):'<span class="muted">—</span>'}</td>`:'';
      return `<tr><th>${esc(s.standard)}</th>${cells}${cost}${time}<td class="certtot">${set.size}</td></tr>`;
    }).join('');
    cmBody=`<div class="matrixwrap"><table class="matrix certmx"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
      <div class="muted" style="font-size:12px;margin-top:.5rem">✓ = standard applies to that region. Cost/Timeline are shown only when a figure actually appears alongside the standard in the project text — never invented.</div>`;
  }

  $('#view').innerHTML=`
    <div class="page">
      ${pageHead('Timeline','How this project got here',
        'A replay of the project\'s history — every decision, assumption, document and answer, in order, with coverage climbing as context is added.')}
      <div class="card">${rail}</div>
      <div class="section-label" style="font-size:22px;margin:2rem 0 .2rem">Certification matrix</div>
      <div class="section-note">Standards detected in your decisions and reviews, mapped against regions — cost and timeline shown only when a real figure appears alongside, never invented.</div>
      <div class="card">${cmBody}</div>
    </div>`;
}

/* ---- UI-CP-9: Execution Context (the handoff — "EDOS decides. Agents execute.") ---- */
let EXECCTX=null;
async function renderExecution(){
  $('#view').innerHTML=`<div class="card"><div class="eyebrow">Execution Context</div><div class="muted">Assembling the spec…</div></div>`;
  let ctx;
  try{ ctx=await api(`/v1/projects/${PID}/execution-context`); }
  catch(e){ $('#view').innerHTML=`<div class="empty">execution-context: ${esc(e.message)}</div>`; return; }
  EXECCTX=ctx;
  const m=ctx.meta||{};
  const prov=m.provisional?`<span class="ec-prov">provisional — no accepted decisions yet</span>`:'';
  const sec=(title,body)=>`<div class="ec-sec"><div class="ec-h">${esc(title)}</div>${body}</div>`;
  const empty=t=>`<div class="ec-empty">${esc(t)}</div>`;
  const refChip=r=>r?`<span class="ec-ref">${refLink(r)}</span>`:'';
  const lineList=(arr,emptyMsg)=>arr&&arr.length?
    `<ul class="ec-list">${arr.map(x=>`<li>${esc(x.text)}${refChip(x.source)}</li>`).join('')}</ul>`:empty(emptyMsg);

  const decs=(ctx.accepted_decisions||[]);
  const decBody=decs.length?decs.map(d=>`
    <div class="ec-dec">
      <div class="ec-dec-top"><span class="ec-id">${esc(d.id)}</span><span class="ec-summ">${esc(d.summary)}</span>
        ${d.provisional?'<span class="ec-prov sm">provisional</span>':''}</div>
      <div class="ec-rec">${esc(d.recommendation)}</div>
      ${(d.key_params||[]).length?`<div class="ec-kp">${d.key_params.map(k=>`<span class="ec-kpi">${esc(k)}</span>`).join('')}</div>`:''}
    </div>`).join(''):empty('Accept a decision (Deep Dive) to populate this spec.');

  const ifaceBody=(ctx.interfaces||[]).length?
    `<div class="ec-chips">${ctx.interfaces.map(i=>`<span class="ec-iface ${i.kind==='component'?'comp':'proto'}">${esc(i.text)}${i.source?`<em>${esc(i.source)}</em>`:''}</span>`).join('')}</div>`
    :empty('No interfaces or bus protocols referenced yet.');

  const stdBody=(ctx.standards||[]).length?
    `<div class="ec-chips">${ctx.standards.map(s=>`<span class="ec-std">${esc(s.text)}</span>`).join('')}</div>`
    :empty('No standards referenced yet.');

  const risks=(ctx.open_risks||[]);
  const riskBody=risks.length?`<ul class="ec-list">${risks.map(r=>`
    <li><span class="ec-rk ${esc(r.kind||'risk')}">${esc((r.kind||'risk').replace('_',' '))}</span> ${esc(r.text)}${refChip(r.source)}</li>`).join('')}</ul>`
    :empty('No open risks. Accepted decisions have no unresolved assumptions, contradictions or freeze-blockers.');

  $('#view').innerHTML=`
    <div class="page">
      ${pageHead('Execution Context','Hand it off to the builders',
        'A clean, machine-readable spec assembled from this project\'s accepted decisions, constraints, interfaces and open risks — ready to paste into any coding agent (Claude Code, Codex, Cursor). EDOS decides; agents execute.')}
      <div class="ec-card">
        <div class="ec-bar">
          <div><div class="ec-title">EXECUTION CONTEXT</div>
            <div class="ec-tag">EDOS decides. Agents execute.</div></div>
          <div class="ec-meta">
            <span>coverage ${m.coverage||0}%</span>
            <button class="ec-copy" onclick="copyExecution(this)">⧉ Copy spec</button>
          </div>
        </div>
        <div class="ec-subhead">Machine-readable spec for any coding agent — Claude Code, Codex, Cursor. ${prov}</div>
        ${sec('Accepted Decisions',decBody)}
        ${sec('Constraints',lineList(ctx.constraints,'No hard constraints captured yet — add requirements or review conditions.'))}
        ${sec('Interfaces',ifaceBody)}
        ${sec('Acceptance Criteria',lineList(ctx.acceptance_criteria,'No acceptance criteria yet — add next actions or measurable requirements.'))}
        ${sec('Standards',stdBody)}
        ${sec('Open Risks',riskBody)}
      </div>
    </div>`;
}
async function copyExecution(btn){
  let txt='';
  try{
    const r=await fetch(`/v1/projects/${PID}/execution-context.txt`);
    txt=await r.text();
  }catch(e){ btn.textContent='copy failed'; return; }
  try{ await navigator.clipboard.writeText(txt); }
  catch{ /* clipboard blocked (e.g. non-secure ctx) — fall back to a selectable textarea */
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');}catch{} ta.remove();
  }
  const old=btn.textContent; btn.textContent='✓ Copied'; setTimeout(()=>btn.textContent=old,1600);
}

/* ---- boot: honour the URL first (refresh/shared link), else single project → its dashboard, else landing ---- */
async function boot(){
  try{ PROJECTS=await api('/v1/projects'); }catch{ PROJECTS=[]; }
  if(location.hash && location.hash.replace(/^#\/?/,'').length){ await routeFromURL(); return; }
  if(PROJECTS.length===1){ openProject(PROJECTS[0].id); }
  else { showHome(); }
}
boot();
