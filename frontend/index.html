<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EDOS — Engineering Decision OS</title>
<style>
  /* ---- design system (matches EDOS_v3 walkthrough: light theme, navy brain bar, purple accent) ---- */
  :root{
    --bg:#eef1f7; --surface:#ffffff; --ink:#1a2030; --ink2:#5a6478; --line:#e3e7f0;
    --accent:#6d5efc; --accent2:#8b7bff; --navy:#0f1629; --navy2:#1a2340;
    /* finding categories */
    --contradiction:#e5484d; --hiddendep:#e5891a; --assumption:#e0b400; --optimization:#3b82f6; --bestpractice:#22a565;
    /* coverage gradient */
    --cov:linear-gradient(90deg,#e5484d,#e5891a,#e0b400,#22a565);
    --radius:12px; --shadow:0 1px 3px rgba(20,30,60,.08),0 1px 2px rgba(20,30,60,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex}
  h1,h2,h3,h4{margin:0}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:.5rem .85rem;background:var(--accent);color:#fff;font-weight:500}
  button.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  button.sm{padding:.25rem .5rem;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  input,textarea,select{width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem}
  a{color:var(--accent);text-decoration:none}
  .muted{color:var(--ink2)} .row{display:flex;gap:.6rem;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1}
  .hide{display:none}

  /* left rail */
  .rail{width:250px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:1rem}
  .brand{font-weight:800;font-size:20px;letter-spacing:.12em;background:linear-gradient(90deg,var(--accent),#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand-sub{font-size:10px;letter-spacing:.18em;color:var(--ink2);margin:.1rem 0 1rem}
  .proj{padding:.5rem .55rem;border-radius:8px;cursor:pointer;display:flex;gap:.4rem;align-items:center}
  .proj:hover,.proj.active{background:#f0f2f9}
  .proj .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .tabs{display:flex;gap:.2rem;padding:.5rem 1.2rem 0;background:var(--surface);border-bottom:1px solid var(--line)}
  .tab{background:transparent;color:var(--ink2);border-radius:0;border-bottom:2px solid transparent;padding:.6rem .8rem;font-weight:500}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent)}
  .view{flex:1;overflow:auto;padding:1.4rem;max-width:1080px;width:100%;margin:0 auto}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1rem;margin-bottom:1.1rem}
  .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--ink2);font-weight:700;text-transform:uppercase;margin-bottom:.5rem}

  /* project brain */
  .brainbar{background:var(--navy);color:#fff;border-radius:var(--radius) var(--radius) 0 0;padding:.9rem 1.2rem;display:flex;align-items:center;gap:.6rem;font-weight:600}
  .brainbar .dot{width:9px;height:9px;border-radius:50%;background:#3ddc97}
  .brainbody{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:1.2rem;box-shadow:var(--shadow)}
  .covwrap{display:flex;align-items:center;gap:1rem;margin-bottom:1.1rem}
  .covtrack{flex:1;height:12px;border-radius:20px;background:#e7eaf3;overflow:hidden}
  .covfill{height:100%;background:var(--cov);border-radius:20px;transition:width .5s}
  .covpct{font-size:26px;font-weight:800;color:var(--accent);min-width:70px;text-align:right}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.1rem}
  .tile{border:1px solid var(--line);border-radius:10px;padding:.9rem;text-align:center}
  .tile .n{font-size:28px;font-weight:800} .tile .l{font-size:11px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase;margin-top:.2rem}
  .domains{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
  .domain{border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem}
  .domain .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:.4rem}
  .dtrack{height:7px;border-radius:20px;background:#e7eaf3;overflow:hidden}
  .dfill{height:100%;background:linear-gradient(90deg,var(--accent),#4ec5ff);border-radius:20px}

  /* reusable finding / severity primitives (used by later UI-CPs) */
  .cat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.12rem .5rem;border-radius:5px;color:#fff}
  .cat.contradiction{background:var(--contradiction)} .cat.hidden_dependency{background:var(--hiddendep)}
  .cat.assumption{background:var(--assumption);color:#3a2e00} .cat.optimization{background:var(--optimization)} .cat.best_practice{background:var(--bestpractice)}
  .pill{display:inline-block;font-size:11px;padding:.1rem .5rem;border-radius:20px;border:1px solid var(--line)}
  .pill.critical{background:#e5484d;color:#fff;border-color:#e5484d} .pill.high{background:#e5891a;color:#fff;border-color:#e5891a}
  .pill.medium{background:#f2d675;color:#3a2e00;border-color:#e0b400} .pill.low{background:#dbe4f5;color:#2c3e66;border-color:#c3d2ec}
  .finding{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:.9rem 1rem;margin-bottom:.8rem}
  .finding.contradiction{border-left-color:var(--contradiction)} .finding.hidden_dependency{border-left-color:var(--hiddendep)}
  .finding.assumption{border-left-color:var(--assumption)} .finding.optimization{border-left-color:var(--optimization)} .finding.best_practice{border-left-color:var(--bestpractice)}
  .ignore{background:#fdf0f0;border:1px dashed #f2c3c3;border-radius:8px;padding:.6rem .8rem;margin-top:.6rem;font-size:13px}
  .ignore .h{color:var(--contradiction);font-weight:700;font-size:11px;letter-spacing:.08em}
  .chip{display:inline-block;font-size:11px;background:#eef0f8;border:1px solid var(--line);border-radius:6px;padding:.15rem .5rem;margin:.15rem .2rem 0 0}

  .empty{color:var(--ink2);text-align:center;padding:2rem}
</style>
</head>
<body>
  <aside class="rail">
    <div class="brand">EDOS</div>
    <div class="brand-sub">ENGINEERING DECISION OS</div>
    <div class="row" style="margin-bottom:.6rem">
      <input id="newProj" placeholder="New project" onkeydown="if(event.key==='Enter')createProject()"/>
      <button onclick="createProject()">+</button>
    </div>
    <div id="projects" class="grow" style="overflow:auto"></div>
    <div class="muted" style="font-size:11px;margin-top:.6rem"><a href="/docs" target="_blank">API docs</a> · decision memory, not chat</div>
  </aside>

  <main class="main">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="brain"  onclick="tab('brain')">Project Brain</button>
      <button class="tab" data-tab="review" onclick="tab('review')">Engineering Review</button>
      <button class="tab" data-tab="deepdive" onclick="tab('deepdive')">Deep Dive</button>
      <button class="tab" data-tab="graph" onclick="tab('graph')">Decision Graph</button>
      <button class="tab" data-tab="execution" onclick="tab('execution')">Execution Context</button>
    </div>
    <div class="view" id="view"></div>
  </main>

<script>
const $=s=>document.querySelector(s);
let PID=null, PROJECTS=[], TAB='brain';

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok){let d;try{d=await r.json()}catch{d=await r.text()}throw new Error((d&&d.detail)||JSON.stringify(d)||r.status)}
  return r.status===204?null:r.json();
}
const esc=s=>(s??'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---- projects (left rail) ---- */
async function loadProjects(){
  PROJECTS=await api('/v1/projects');
  $('#projects').innerHTML=PROJECTS.map(p=>`
    <div class="proj ${p.id===PID?'active':''}" onclick="openProject('${p.id}')">
      <span class="nm">${esc(p.name)}</span>
      <button class="ghost sm" title="Delete" onclick="event.stopPropagation();delProject('${p.id}','${esc(p.name)}')">🗑</button>
    </div>`).join('')||'<div class="muted" style="font-size:12px">No projects yet</div>';
}
async function createProject(){
  const name=$('#newProj').value.trim(); if(!name)return;
  const p=await api('/v1/projects',{method:'POST',body:JSON.stringify({name})});
  $('#newProj').value=''; await loadProjects(); openProject(p.id);
}
async function delProject(id,name){
  if(!confirm(`Delete project "${name}" and all its data?`))return;
  await api(`/v1/projects/${id}`,{method:'DELETE'});
  if(PID===id)PID=null;
  await loadProjects(); render();
}
async function openProject(id){ PID=id; loadProjects(); tab('brain'); }

/* ---- tab routing ---- */
function tab(t){ TAB=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); render(); }
function render(){
  if(!PID){ $('#view').innerHTML='<div class="empty">Pick or create a project on the left to open its <b>Project Brain</b>.</div>'; return; }
  if(TAB==='brain') return renderBrain();
  $('#view').innerHTML=`<div class="card"><div class="eyebrow">${esc(TAB)}</div><div class="muted">This surface arrives in a later UI checkpoint (see BACKLOG-UI.md). The Project Brain + project management are live now.</div></div>`;
}

/* ---- UI-CP-1: Project Brain (live coverage + counts from GET /brain) ---- */
let COVDOMAIN=null; // when set, the coverage detail panel for that domain is shown

async function renderBrain(){
  COVDOMAIN=null;
  const p=PROJECTS.find(x=>x.id===PID)||{name:'Project'};
  let brain={coverage:0,coverage_by_domain:{},counts:{decisions:0,assumptions:0,contradictions:0,open_risks:0}};
  let items=0;
  try{ brain=await api(`/v1/projects/${PID}/brain`); }catch(e){ console.warn('brain',e); }
  try{ items=(await api(`/v1/projects/${PID}/items`)).length; }catch{}
  const c=brain.counts, cov=brain.coverage||0;
  const DOMAINS=['Architecture','Hardware','Firmware','Manufacturing','Testing','Certification'];
  $('#view').innerHTML=`
    <div class="brainbar"><span class="dot"></span> PROJECT BRAIN · ${esc(p.name)} <span class="grow"></span>
      <span class="muted" style="color:#9fb0d0;font-size:12px">${items} context items</span></div>
    <div class="brainbody">
      <div class="eyebrow">Coverage <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— how complete this project's engineering context is</span></div>
      <div class="covwrap"><div class="covtrack"><div class="covfill" style="width:${cov}%"></div></div><div class="covpct">${cov}%</div></div>
      <div class="tiles">
        <div class="tile"><div class="n">${c.decisions}</div><div class="l">Decisions</div></div>
        <div class="tile"><div class="n">${c.assumptions}</div><div class="l">Assumptions</div></div>
        <div class="tile"><div class="n">${c.contradictions}</div><div class="l">Contradictions</div></div>
        <div class="tile"><div class="n">${c.open_risks}</div><div class="l">Open Risks</div></div>
      </div>
      <div class="eyebrow">Decision coverage <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— click a domain to raise it</span></div>
      <div class="domains">
        ${DOMAINS.map(d=>{const v=brain.coverage_by_domain[d]||0;return `
          <div class="domain" style="cursor:pointer" onclick="openCoverage('${d}')" title="Answer questions / attach datasheets to raise ${d} coverage">
            <div class="top"><span>${d}</span><b>${v}%</b></div>
            <div class="dtrack"><div class="dfill" style="width:${v}%"></div></div>
          </div>`;}).join('')}
      </div>
      <div class="row" style="margin-top:1.2rem">
        <button onclick="tab('review')">Start Engineering Review</button>
        <button class="ghost" onclick="tab('deepdive')">Deep Dive</button>
      </div>
    </div>`;
}

/* ---- UI-CP-2: coverage detail panel for one domain (nudges + attach datasheet) ---- */
async function openCoverage(domain){
  COVDOMAIN=domain;
  let data;
  try{ data=await api(`/v1/projects/${PID}/coverage`); }catch(e){ alert('coverage: '+e.message); return; }
  const d=data.domains[domain]||{coverage:0,items:0,docs:0,unanswered:[],total_questions:0,answered:[]};
  const answered=(d.answered||[]).length;
  $('#view').innerHTML=`
    <div class="brainbar"><span class="dot"></span> COVERAGE · ${esc(domain)} <span class="grow"></span>
      <button class="ghost sm" onclick="renderBrain()">← Project Brain</button></div>
    <div class="brainbody">
      <div class="covwrap"><div class="covtrack"><div class="covfill" style="width:${d.coverage}%"></div></div><div class="covpct">${d.coverage}%</div></div>
      <div class="muted" style="margin-bottom:1rem">${d.items} context item(s) · ${d.docs} document(s) · ${answered}/${d.total_questions} questions answered. Nothing here is mandatory — each addition raises this domain's coverage.</div>

      <div class="eyebrow">Attach a datasheet / document</div>
      <div class="card" style="box-shadow:none">
        <textarea id="covdoc" rows="2" placeholder="Paste datasheet text, spec, or a reference for ${esc(domain)}…"></textarea>
        <div class="row" style="margin-top:.5rem;justify-content:flex-end">
          <button onclick="attachDoc('${domain}')">Attach document</button>
        </div>
      </div>

      <div class="eyebrow">Answer these to raise coverage</div>
      ${d.unanswered.length? d.unanswered.map(q=>`
        <div class="card" style="box-shadow:none">
          <div style="font-weight:600;margin-bottom:.4rem">${esc(q.q)}</div>
          <textarea id="q-${q.id}" rows="2" placeholder="Your answer…"></textarea>
          <div class="row" style="margin-top:.5rem;justify-content:flex-end">
            <button onclick="answerCoverage('${domain}','${q.id}')">Save answer</button>
          </div>
        </div>`).join('')
        : '<div class="muted" style="padding:.5rem">All question-set questions answered for this domain. 🎉</div>'}
    </div>`;
}

async function answerCoverage(domain,qid){
  const el=$(`#q-${qid}`); const answer=(el.value||'').trim();
  if(!answer){ el.focus(); return; }
  await api(`/v1/projects/${PID}/coverage/answer`,{method:'POST',
    body:JSON.stringify({domain,question_id:qid,answer})});
  openCoverage(domain); // re-fetch → this domain's % visibly rises
}

async function attachDoc(domain){
  const el=$('#covdoc'); const content=(el.value||'').trim();
  if(!content){ el.focus(); return; }
  await api(`/v1/projects/${PID}/items`,{method:'POST',
    body:JSON.stringify({item_type:'document',content,domain})});
  openCoverage(domain);
}

loadProjects().then(render);
</script>
</body>
</html>
