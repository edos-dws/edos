<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EDOS — Engineering Decision OS</title>
<style>
  /* ---- Claude design system (getdesign.md/claude): warm cream canvas · coral accent · warm-dark surfaces ·
         Fraunces serif display + Inter body + JetBrains Mono. Class names preserved from the prior build. ---- */
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    /* surfaces */
    --canvas:#faf9f5; --surface:#ffffff; --surface-soft:#f5f0e8; --surface-card:#efe9de; --cream-strong:#e8e0d2;
    --bg:#faf9f5;
    /* text */
    --ink:#141413; --body:#3d3d3a; --body-strong:#252523; --ink2:#6c6a64; --muted-soft:#8e8b82;
    /* lines */
    --line:#e6dfd8; --line-soft:#ebe6df;
    /* brand */
    --accent:#cc785c; --accent2:#a9583e; --accent-soft:#f3e3db; --teal:#5db8a6; --amber:#e8a55a;
    /* warm-dark product surfaces (replaces the old cool navy) */
    --navy:#181715; --navy2:#252320; --dark-soft:#1f1e1b; --on-dark:#faf9f5; --on-dark-soft:#a09d96;
    /* finding categories (warm-tuned) */
    --contradiction:#c64545; --hiddendep:#e8a55a; --assumption:#d4a017; --optimization:#5db8a6; --bestpractice:#5db872;
    --success:#5db872; --warning:#d4a017; --error:#c64545;
    --cov:linear-gradient(90deg,#c64545,#e8a55a,#d4a017,#5db872);
    /* type */
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --radius:12px; --radius-sm:8px; --radius-lg:16px;
    --shadow:0 1px 3px rgba(20,20,19,.05),0 1px 2px rgba(20,20,19,.03);
    --shadow-lg:0 12px 40px rgba(20,20,19,.10),0 3px 10px rgba(20,20,19,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 var(--sans);background:var(--canvas);color:var(--body);height:100vh;display:flex;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,h4{margin:0;color:var(--ink)}
  h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
  /* Standard button: a 1px border on EVERY variant (transparent on primary) so a primary and a ghost sitting
     side by side are the exact same height — border-box + same padding = identical box. inline-flex centres
     the label so multi-item labels (icon + text) stay aligned. Card-style buttons re-declare display below. */
  /* Standard control height (var(--ctl)) so a button and an input sitting together are always the SAME height
     — box-sizing:border-box means the 1px border is included, so both are exactly --ctl tall. */
  :root{--ctl:42px}
  button{font:inherit;font-weight:500;font-size:14px;line-height:1;cursor:pointer;height:var(--ctl);
    border:1px solid transparent;border-radius:var(--radius-sm);padding:0 1.1rem;
    background:var(--accent);color:#fff;transition:background .15s,border-color .15s,transform .05s;
    display:inline-flex;align-items:center;justify-content:center;gap:.4rem;white-space:nowrap;vertical-align:middle}
  button:hover:not(:disabled){background:var(--accent2)}
  button:active:not(:disabled){transform:translateY(1px)}
  button.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
  button.ghost:hover:not(:disabled){background:var(--surface-soft);border-color:var(--muted-soft)}
  button.sm{height:34px;padding:0 .7rem;font-size:13px}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* card- / control-style buttons manage their own size — don't force the standard control height on them */
  .projcard,.sessitem,.pc-del,.stat{height:auto}
  /* button rows: a shared class so two buttons side by side are always aligned + evenly gapped */
  .btnrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
  .btnrow.end{justify-content:flex-end}
  input,textarea,select{width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.6rem .75rem;transition:border-color .15s,box-shadow .15s}
  input,select{height:var(--ctl);padding:0 .75rem}  /* single-line controls match the button height exactly */
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(204,120,92,.15)}
  ::selection{background:var(--accent-soft)}
  a{color:var(--accent);text-decoration:none}
  .muted{color:var(--ink2)} .row{display:flex;gap:.6rem;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1}
  .hide{display:none}

  /* ---- Sidebar navigation (replaces top tabs) ---- */
  .rail{width:256px;flex:none;background:var(--surface-soft);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:1.2rem .9rem;overflow:visible;position:relative;z-index:5}
  .brand{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:-.01em;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.4rem;padding:0 .3rem;margin-bottom:1.1rem}
  .brand::before{content:"◆";color:var(--accent);font-size:15px}
  /* project switcher */
  .navproj-wrap{position:relative;margin-bottom:1.1rem}
  .navproj{width:100%;display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius-sm);padding:.6rem .7rem;font-weight:500;box-shadow:var(--shadow)}
  .navproj:hover{background:var(--surface);border-color:var(--cream-strong)}
  .navproj .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .navproj .cap{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navproj .cv{font-size:11px;color:var(--muted-soft);font-weight:600}
  /* nav items */
  .nav{display:flex;flex-direction:column;gap:2px}
  .navlbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-soft);font-weight:600;padding:.3rem .6rem .5rem}
  .navitem{display:flex;align-items:center;justify-content:flex-start;gap:.6rem;width:100%;text-align:left;background:transparent;color:var(--body);border-radius:var(--radius-sm);padding:.55rem .6rem;font-weight:450;font-size:14.5px;transition:background .12s,color .12s}
  /* hover + active both use the primary (coral) bg → white text/icon for readability (active is bolder) */
  .navitem:hover{background:var(--accent);color:#fff}
  .navitem:hover .ni-ic{color:#fff}
  .navitem.active{background:var(--accent);color:#fff;font-weight:600}
  .navitem.active:hover{background:var(--accent2);color:#fff}
  .navitem .ni-ic{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-soft);flex:none}
  .ni-ic svg{width:17px;height:17px}
  .navitem.active .ni-ic{color:#fff}
  .cv{display:inline-flex;align-items:center;color:var(--muted-soft)}
  .cv svg{width:15px;height:15px}
  .nav-foot{margin-top:auto;padding-top:.8rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
  .nav-foot .navitem{font-size:13.5px;color:var(--ink2)}

  /* main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  /* full-width scroller so the scrollbar sits at the far right of the window (Claude-style); content is
     centred by the inner page wrappers (.page / .bpage), not by the scroller itself. */
  .view{flex:1;overflow-y:scroll;overflow-x:hidden;padding:2.2rem 2.4rem 3rem;width:100%}
  .view>*{max-width:1040px;margin-left:auto;margin-right:auto}
  /* thin, warm, always-present scrollbars */
  .view::-webkit-scrollbar,.chatthread::-webkit-scrollbar,.histrow::-webkit-scrollbar{width:10px;height:8px}
  .view::-webkit-scrollbar-thumb,.chatthread::-webkit-scrollbar-thumb,.histrow::-webkit-scrollbar-thumb{background:var(--cream-strong);border-radius:10px;border:2px solid var(--canvas)}
  .view::-webkit-scrollbar-thumb:hover,.chatthread::-webkit-scrollbar-thumb:hover{background:var(--muted-soft)}
  *{scrollbar-width:thin;scrollbar-color:var(--cream-strong) transparent}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.4rem;margin-bottom:1.2rem}
  .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted-soft);font-weight:600;text-transform:uppercase;margin-bottom:.6rem}

  /* ---- Shared editorial page header (every section) ---- */
  .page{max-width:1040px;margin:0 auto}  /* same measure as .bpage → content width is identical on every tab */
  .pagehead{margin-bottom:1.6rem}
  .pagehead .ph-top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
  .pagehead h1{font-family:var(--serif);font-size:clamp(28px,3.6vw,36px);font-weight:500;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
  .pagehead .ph-sub{color:var(--ink2);margin-top:.5rem;font-size:15px;max-width:64ch;line-height:1.5}

  /* ---- Landing / project gallery ---- */
  body.home{display:block;overflow:auto}
  body.home .rail,body.home .main{display:none}
  #home{display:none} body.home #home{display:block}
  .landing{min-height:100vh;background:
    radial-gradient(1000px 460px at 88% -12%,rgba(204,120,92,.10),transparent 60%),
    radial-gradient(720px 460px at -5% 110%,rgba(232,165,90,.08),transparent 55%),var(--canvas)}
  .landtop{max-width:960px;margin:0 auto;padding:1.5rem 1.8rem;display:flex;align-items:center;justify-content:space-between}
  .landwrap{max-width:960px;margin:0 auto;padding:1.2rem 1.8rem 5rem}
  .hero{padding:1.4rem 0 2.2rem}
  .hero-eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:1rem}
  .hero-h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5.5vw,56px);line-height:1.06;letter-spacing:-.02em;color:var(--ink)}
  .hero-sub{font-size:18px;line-height:1.55;color:var(--body);max-width:60ch;margin-top:1.1rem}
  /* create-project row */
  .newproj{display:flex;align-items:stretch;gap:.7rem;max-width:560px;margin-bottom:3rem}
  .newproj input{flex:1;font-size:15px}
  .newproj button{flex:none;height:46px;padding:0 1.3rem}
  /* projects section */
  .landsec-h{display:flex;align-items:center;gap:.55rem;font-family:var(--serif);font-size:22px;font-weight:500;color:var(--ink);margin-bottom:1.1rem}
  .landsec-h .cnt{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--muted-soft);background:var(--surface-card);border-radius:9999px;padding:.12rem .55rem}
  .landempty{color:var(--ink2);font-size:15px;padding:.5rem 0}
  .projgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:1rem}
  .projcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.3rem;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;text-align:left;color:var(--body);display:flex;flex-direction:column;min-height:158px}
  .projcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--cream-strong)}
  .pc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
  .pc-mark{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent2);font-family:var(--serif);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .pc-del{background:transparent;color:var(--muted-soft);border:0;padding:.25rem;opacity:0;transition:opacity .12s,color .12s;font-size:14px}
  .projcard:hover .pc-del{opacity:1}
  .pc-del:hover{color:var(--error);background:transparent}
  .pc-name{font-family:var(--serif);font-size:21px;font-weight:500;color:var(--ink);letter-spacing:-.01em;line-height:1.2}
  .pc-meta{margin-top:.35rem;color:var(--ink2);font-size:13.5px}
  .pc-foot{margin-top:auto;padding-top:1rem;display:flex;align-items:center;gap:.35rem;color:var(--accent);font-weight:500;font-size:14px}
  .pc-arw{transition:transform .15s}
  .projcard:hover .pc-arw{transform:translateX(3px)}
  .section-label{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--ink);margin:2rem 0 .35rem}
  .section-note{color:var(--ink2);margin-bottom:1rem;font-size:15px}

  /* project brain */
  .brainbar{background:var(--navy);color:var(--on-dark);border-radius:var(--radius) var(--radius) 0 0;padding:1.1rem 1.4rem;display:flex;align-items:center;gap:.6rem;font-weight:500;font-size:15px}
  .brainbar .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(93,184,114,.2)}
  .brainbody{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:1.5rem;box-shadow:var(--shadow)}
  .covwrap{display:flex;align-items:center;gap:1rem;margin-bottom:1.3rem}
  .covtrack{flex:1;height:12px;border-radius:20px;background:var(--surface-card);overflow:hidden}
  .covfill{height:100%;background:var(--cov);border-radius:20px;transition:width .5s}
  .covpct{font-family:var(--serif);font-size:30px;font-weight:500;color:var(--accent);min-width:74px;text-align:right}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.3rem}
  .tile{border:1px solid var(--line);border-radius:var(--radius-sm);padding:1rem;text-align:center;background:var(--surface-soft);transition:border-color .12s,transform .1s}
  .tile[onclick]:hover{border-color:var(--accent);transform:translateY(-1px)}
  .tile .n{font-family:var(--serif);font-size:32px;font-weight:500;color:var(--ink)} .tile .l{font-size:11px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase;margin-top:.2rem}
  .domains{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
  .domain{border:1px solid var(--line);border-radius:var(--radius-sm);padding:.85rem .9rem;background:var(--surface-soft)}
  .domain .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:.4rem}
  .dtrack{height:7px;border-radius:20px;background:var(--surface-card);overflow:hidden}
  .dfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--amber));border-radius:20px}

  /* ---- Editorial Project Brain dashboard ---- */
  .bpage{max-width:1040px;margin:0 auto}
  .bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.6rem;flex-wrap:wrap}
  .b-title{font-family:var(--serif);font-size:clamp(28px,3.6vw,36px);font-weight:500;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
  .b-sub{color:var(--ink2);margin-top:.5rem;font-size:15px;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .b-sub .iso{display:inline-flex;align-items:center;gap:.35rem;background:var(--surface-card);border-radius:var(--radius-pill,9999px);padding:.15rem .6rem;font-size:12px;color:var(--body-strong)}
  .b-actions{display:flex;gap:.6rem;flex-wrap:wrap}
  .covpanel{display:grid;grid-template-columns:auto 1fr;gap:2.2rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.9rem 2.1rem;box-shadow:var(--shadow);margin-bottom:1.2rem}
  .donut{position:relative;width:150px;height:150px;flex:none}
  .donut svg{transform:rotate(-90deg)}
  .donut .track{fill:none;stroke:var(--surface-card);stroke-width:13}
  .donut .prog{fill:none;stroke:var(--accent);stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .7s ease}
  .donut .dlabel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut .dpct{font-family:var(--serif);font-size:38px;color:var(--ink);line-height:1}
  .donut .dcap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-soft);margin-top:.25rem}
  .covmeta .interp{font-family:var(--serif);font-size:24px;color:var(--ink);margin-bottom:.35rem;letter-spacing:-.01em}
  .covmeta .cnote{color:var(--body);font-size:15px;line-height:1.55;max-width:52ch}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin-bottom:2rem}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem}
  .stat.click{cursor:pointer;transition:border-color .12s,transform .1s}
  .stat.click:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
  .stat .sn{font-family:var(--serif);font-size:36px;font-weight:500;color:var(--ink);line-height:1}
  .stat .sl{font-size:12.5px;color:var(--ink2);margin-top:.35rem;display:flex;align-items:center;gap:.3rem}
  .stat.warn .sn{color:var(--warning)} .stat.bad .sn{color:var(--error)}
  .domcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .domrow{display:grid;grid-template-columns:160px 1fr 52px 16px;gap:1rem;align-items:center;padding:.95rem 1.3rem;cursor:pointer;transition:background .12s;border-top:1px solid var(--line-soft)}
  .domrow:first-child{border-top:0}
  .domrow:hover{background:var(--surface-soft)}
  .domrow .dn{font-weight:500;color:var(--ink)}
  .domrow .dbar{height:8px;border-radius:20px;background:var(--surface-card);overflow:hidden}
  .domrow .dbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--amber));border-radius:20px;transition:width .6s}
  .domrow .dv{text-align:right;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
  .domrow .dchev{color:var(--muted-soft)}
  @media(max-width:720px){.covpanel{grid-template-columns:1fr;text-align:center;justify-items:center}.statgrid{grid-template-columns:repeat(2,1fr)}.domrow{grid-template-columns:110px 1fr 44px}}

  /* reusable finding / severity primitives (used by later UI-CPs) */
  .cat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.12rem .5rem;border-radius:5px;color:#fff}
  .cat.contradiction{background:var(--contradiction)} .cat.hidden_dependency{background:var(--hiddendep)}
  .cat.assumption{background:var(--assumption);color:#3a2e00} .cat.optimization{background:var(--optimization)} .cat.best_practice{background:var(--bestpractice)}
  .pill{display:inline-block;font-size:11px;padding:.1rem .5rem;border-radius:20px;border:1px solid var(--line)}
  .pill.critical{background:#e5484d;color:#fff;border-color:#e5484d} .pill.high{background:#e5891a;color:#fff;border-color:#e5891a}
  .pill.medium{background:#f2d675;color:#3a2e00;border-color:#e0b400} .pill.low{background:#d8d3c8;color:#2c2a26;border-color:#b8b2a6}
  .finding{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:.9rem 1rem;margin-bottom:.8rem}
  .finding.contradiction{border-left-color:var(--contradiction)} .finding.hidden_dependency{border-left-color:var(--hiddendep)}
  .finding.assumption{border-left-color:var(--assumption)} .finding.optimization{border-left-color:var(--optimization)} .finding.best_practice{border-left-color:var(--bestpractice)}
  .ignore{background:#fdf0f0;border:1px dashed #f2c3c3;border-radius:8px;padding:.6rem .8rem;margin-top:.6rem;font-size:13px}
  .ignore .h{color:var(--contradiction);font-weight:700;font-size:11px;letter-spacing:.08em}
  .chip{display:inline-block;font-size:11px;background:#f5f0e8;border:1px solid var(--line);border-radius:6px;padding:.15rem .5rem;margin:.15rem .2rem 0 0}

  .empty{color:var(--ink2);text-align:center;padding:2rem}

  /* ---- UI-CP-4: Deep Dive Q&A ---- */
  .userinput{background:var(--navy);color:#e6e0d5;border-left:3px solid #5db872;border-radius:10px;padding:.9rem 1.1rem;margin-bottom:1.1rem}
  .userinput .l{font-size:10px;letter-spacing:.16em;color:#a09d96;font-weight:700}
  .qcard{border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;margin-bottom:.8rem;background:var(--surface)}
  .qcard .qh{color:var(--accent);font-weight:700;margin-bottom:.5rem}
  .whybox{background:var(--accent-soft);border:1px solid #e8cdbf;border-radius:8px;padding:.6rem .8rem;margin-bottom:.6rem}
  .whybox .h{color:var(--accent2);font-weight:700;font-size:10px;letter-spacing:.1em}
  .whybox .t{font-size:13px;color:#7a4a38;margin-top:.2rem}
  /* UI-CP-11: already-known (skipped) hint + adaptive follow-up */
  .skipped{background:#eafaf1;border:1px solid #bfe8d2;border-radius:10px;padding:.7rem .9rem;margin-bottom:1rem}
  .skipped .sh{color:#0d7a45;font-weight:700;font-size:12px}
  .skipped ul{margin:.4rem 0 0;padding-left:1.1rem;font-size:13px;color:#2f4a3c}
  .skipped li{margin:.15rem 0}
  .fuhead{color:var(--accent2);font-weight:700;font-size:12px;letter-spacing:.04em;margin:.2rem 0 .5rem}
  .qcard.followup{border-color:#e0b9a8;background:#fdf6f2}
  /* zero-question confirmation (Q2) */
  /* answered coverage question — stays visible + editable, distinct "answered" look */
  /* compact coverage question/answer card + input with an embedded submit arrow (no button label) */
  .qcov{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.7rem .85rem;margin-bottom:.6rem}
  .qcov.answered{border-left:3px solid var(--success);background:var(--surface-soft)}
  .qcov .qq{font-weight:600;font-size:14px;line-height:1.4;color:var(--ink);margin-bottom:.4rem}
  .qinput{position:relative}
  .qinput textarea{padding-right:2.6rem;margin:0;min-height:0}
  .qsend{position:absolute;right:.4rem;bottom:.4rem;width:30px;height:30px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .qsend svg{width:15px;height:15px}
  .qa-badge{display:inline-block;font-size:11px;font-weight:600;color:#3f8f56;background:#e9f4ec;border:1px solid #cbe6d3;border-radius:20px;padding:.05rem .55rem;margin-bottom:.35rem}
  .confirmbox{border:1px solid var(--line);border-left:3px solid var(--success);border-radius:10px;padding:1rem 1.1rem;background:var(--surface)}
  .confirmbox .cb-h{color:#3f8f56;font-weight:600;font-size:14px}
  .confirmbox .cb-note{color:var(--ink2);font-size:13.5px;margin-top:.2rem}
  .confirmbox .cb-understanding{margin-top:.8rem;background:var(--surface-soft);border-radius:8px;padding:.7rem .85rem;font-size:14.5px;color:var(--ink)}
  .confirmbox .cb-lbl{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-soft);font-weight:600;margin-bottom:.25rem}

  /* ---- UI-CP-4: Decision Card ---- */
  .deccard{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1.1rem;background:var(--surface)}
  .dechead{background:linear-gradient(120deg,#252320,#181715);color:var(--on-dark);padding:1.3rem 1.4rem}
  .dechead .eye{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--accent);opacity:1}
  .dechead h2{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
  .dechead h2{font-size:22px;margin:.15rem 0 .6rem}
  .dechead .meta{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;font-size:13px}
  .decstatus{font-size:11px;font-weight:800;letter-spacing:.08em;padding:.2rem .6rem;border-radius:5px;text-transform:uppercase}
  .decstatus.proposed,.decstatus.recommended{background:#f0d264;color:#3a2e00}
  .decstatus.accepted,.decstatus.verified{background:#5db872;color:#06331f}
  .decstatus.frozen{background:#d8d3c8;color:#2c2a26}
  .dechead .missing{color:#f0ddd2}
  .decbody{padding:1.2rem}

  /* comparison matrix */
  .matrixwrap{overflow-x:auto}
  table.matrix{border-collapse:collapse;width:100%;font-size:13px}
  table.matrix th,table.matrix td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
  table.matrix thead th{background:var(--navy);color:#fff;font-weight:600;white-space:nowrap}
  table.matrix tbody th{background:#f5f0e8;font-weight:600;white-space:nowrap}
  table.matrix td.rec,table.matrix th.rec{background:#eafaf1}
  table.matrix thead th.rec{background:#1f9d61;color:#fff}
  table.matrix tbody tr:nth-child(even) td:not(.rec){background:#faf9f5}

  /* recommendation block */
  .recblock{background:#eefaf2;border:1px solid #bfe9cf;border-radius:10px;padding:1rem 1.1rem;margin-top:1rem}
  .recblock .rh{color:#1f9d61;font-weight:700;font-size:11px;letter-spacing:.1em}
  .recblock h3{font-size:18px;color:#0d6b3f;margin:.2rem 0 .5rem}
  .recblock ul{margin:.3rem 0;padding-left:1.1rem}
  .recblock .elim{color:var(--ink2);font-size:12px;margin-top:.5rem}
  .runnerup{margin-top:.6rem;padding:.6rem .8rem;border:1px dashed var(--line);border-radius:8px;font-size:13px;background:var(--card2,#faf9f7)}
  .runnerup .rulabel{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--ink2);text-transform:uppercase;margin-right:.35rem}
  .runnerup .rugap{font-size:11px;color:var(--ink2);margin-left:.4rem}
  .runnerup .rugap.narrow{color:#c2410c;font-weight:700}
  .runnerup .rutip{color:var(--ink2);font-size:12px;margin-top:.3rem}
  .compwrap{display:flex;flex-direction:column;gap:.3rem;margin-top:.3rem}
  .comprow{display:flex;align-items:center;gap:.5rem;font-size:13px}
  .comprow code{background:var(--chipbg,#eef1ee);padding:.05rem .35rem;border-radius:4px;font-size:12px}
  .comprow .cq{color:var(--ink2);min-width:120px}
  .ck{font-weight:800;width:1.1em;text-align:center}
  .ck.ok{color:#1f9d61}.ck.bad{color:#c0392b}.ck.na{color:var(--ink2)}
  .ckmis{color:#c0392b;font-size:12px}
  .framepanel{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:.8rem 1rem;background:var(--card2,#faf9f7)}
  .framepanel .fp-h{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--accent)}
  .framepanel .fp-u{font-size:13px;color:var(--ink);margin:.4rem 0 .2rem}
  .framepanel .fp-lbl{font-size:10px;letter-spacing:.08em;font-weight:700;color:var(--ink2);text-transform:uppercase;margin:.7rem 0 .35rem}
  .spinewrap,.scanwrap{display:flex;flex-wrap:wrap;gap:.35rem}
  .spinechip{font-size:11px;padding:.15rem .5rem;border-radius:20px;background:var(--chipbg,#eef1ee);color:var(--ink)}
  .spinechip b{color:var(--ink2);font-weight:600;text-transform:capitalize}
  .lenswrap{display:flex;flex-direction:column;gap:.3rem}
  .lensrow.deep{display:flex;align-items:center;gap:.5rem;font-size:13px}
  .lensrow .lw{display:inline-block;min-width:26px;text-align:center;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:5px;padding:.05rem .25rem}
  .lenschip{font-size:11px;padding:.15rem .5rem;border-radius:6px;border:1px dashed var(--line);color:var(--ink2)}
  .framepanel .fp-asks{font-size:12px;color:var(--ink2);font-style:italic}

  /* decision impact grid */
  .impactgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
  .impactcell{border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;font-size:13px}
  .impactcell b{color:var(--accent)}

  /* decision explorer (dark panel) */
  .explorer{background:var(--navy);color:#cfc9bd;border-radius:10px;padding:1rem 1.1rem;margin-top:1.1rem}
  .explorer .eh{color:#fff;font-size:11px;letter-spacing:.16em;font-weight:700;margin-bottom:.7rem}
  .exprow{display:grid;grid-template-columns:150px 1fr;gap:.6rem;padding:.35rem 0;font-size:13px;border-top:1px solid #24304f}
  .exprow:first-of-type{border-top:0}
  .exprow .k{color:#a09d96}
  .chip.dark{background:#1e2947;border-color:#33302b;color:#b8b2a6}
  /* assumption lifecycle status chips (UI-CP-6): created=neutral, validated=green, challenged=amber, invalidated=red */
  .achip{display:inline-block;font-size:12px;border-radius:6px;padding:.2rem .55rem;margin:.15rem .25rem .15rem 0;border:1px solid var(--line);font-weight:600}
  .achip .aid{font-weight:800;opacity:.85;margin-right:.35rem}
  .achip.created{background:#f5f0e8;color:#2c2a26;border-color:#b8b2a6}
  .achip.validated{background:#e3f6ec;color:#0f6b3d;border-color:#9bd8b6}
  .achip.challenged{background:#fdf0d9;color:#8a5a00;border-color:#eccf86}
  .achip.invalidated{background:#fde3e3;color:#a5231f;border-color:#f0b3b1}
  .arow{border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem;margin-bottom:.6rem}
  .arow .asrc{font-size:12px;color:var(--ink2);margin-top:.25rem}
  .achip.dark{border-color:#33302b}
  .challenge{background:#ef8b2c;color:#fff;font-weight:700;margin-top:1rem}
  .challenge:hover{background:#e07d1d}

  /* Deep Dive sessions strip — past decisions in this project (each decision = a session/chat) */
  .sessions{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin-bottom:1rem}
  .sesslist{display:flex;flex-wrap:wrap;gap:.5rem}
  .sessitem{display:block;text-align:left;background:#f5f0e8;border:1px solid var(--line);border-radius:10px;
    padding:.5rem .7rem;min-width:200px;max-width:320px;cursor:pointer;color:var(--ink);font:inherit;font-weight:400}
  .sessitem:hover{border-color:var(--navy);background:#f5f0e8}
  .sessitem.active{border-color:var(--navy);background:#eafaf1;box-shadow:0 0 0 1px var(--navy) inset}
  .sessitem .st{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sessitem .sm{display:flex;align-items:center;gap:.4rem;margin-top:.3rem;font-size:11px}

  /* ---- Deep Dive as a chat (Claude-style thread + composer with a PROJECT selector) ---- */
  /* chatmode: the view becomes a fixed-height flex column — thread scrolls, composer is pinned to the very
     bottom with no gap below it, and the whole conversation column is a touch narrower than other pages. */
  .view.chatmode{padding:0;overflow:hidden;display:flex;flex-direction:column}
  .chatmode .chatshell{flex:1;min-height:0;height:auto;padding:0;width:100%;max-width:900px}
  .chatmode .chattop{padding:1.4rem 1.8rem 1rem}
  .chatmode .histrow{padding-left:1.8rem;padding-right:1.8rem;margin-bottom:0}
  .chatmode .chatthread{flex:1;min-height:0;overflow-y:auto;padding:1.2rem 1.8rem 1rem}
  .chatmode .composer{position:static;padding:.6rem 1.8rem .9rem;background:var(--canvas);border-top:1px solid var(--line);flex:none}
  .chatshell{display:flex;flex-direction:column;min-height:calc(100vh - 130px)}
  .chattop{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-bottom:1rem;margin-bottom:.4rem;border-bottom:1px solid var(--line)}
  .chattop .ct-title{font-family:var(--serif);font-size:22px;color:var(--ink)}
  .chattop .ct-title small{font-family:var(--sans);font-size:13px;color:var(--ink2);font-weight:400}
  .histrow{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0 .3rem;margin-bottom:.6rem}
  .histrow::-webkit-scrollbar{height:6px} .histrow::-webkit-scrollbar-thumb{background:var(--cream-strong);border-radius:6px}
  .chattop .ct-hist svg{width:15px;height:15px}
  .chattop .ct-hist.active{background:var(--surface-card);border-color:var(--muted-soft)}
  /* decision history panel (opened via the history icon) */
  .histpanel{flex:1;min-height:0;overflow-y:auto;padding:1.4rem 1.8rem}
  .hp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
  .histlist{display:flex;flex-direction:column;gap:.6rem;max-width:720px}
  .histitem{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;height:auto;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1.1rem;color:var(--body);transition:border-color .12s,transform .1s}
  .histitem:hover{border-color:var(--accent);transform:translateY(-1px)}
  .histitem.active{border-color:var(--accent);background:var(--accent-soft)}
  .histitem .hi-title{font-weight:500;color:var(--ink)}
  .histitem .hi-meta{display:flex;align-items:center;gap:.5rem;margin-top:.3rem;font-size:12px}
  .histitem .hi-arw{color:var(--muted-soft);flex:none}
  .chatthread{flex:1;display:flex;flex-direction:column;gap:1.2rem;padding:.8rem 0 1.4rem}
  .msg{display:flex;gap:.8rem;align-items:flex-start;max-width:100%}
  .msg.user{flex-direction:row-reverse}
  .msg .av{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;margin-top:.1rem}
  .msg.asst .av{background:var(--accent);color:#fff;font-family:var(--serif)}
  .msg.user .av{background:var(--surface-card);color:var(--ink)}
  .bubble{border-radius:var(--radius-lg);padding:1rem 1.2rem;line-height:1.55;max-width:min(760px,88%)}
  .msg.asst .bubble{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
  .msg.user .bubble{background:var(--surface-card);color:var(--body-strong)}
  .bubble .b-lead{font-family:var(--serif);font-size:17px;color:var(--ink);margin-bottom:.3rem}
  .bubble.wide{max-width:100%;width:100%}
  .thinking{display:inline-flex;gap:.3rem;align-items:center;color:var(--ink2)}
  .thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:blink 1.2s infinite}
  .thinking i:nth-child(2){animation-delay:.2s} .thinking i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  /* composer */
  .composer{position:sticky;bottom:0;padding:.6rem 0 .3rem;background:linear-gradient(180deg,transparent,var(--canvas) 22%)}
  .composer-inner{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:.7rem .8rem .6rem;transition:border-color .15s,box-shadow .15s}
  .composer-inner:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(204,120,92,.12),var(--shadow-lg)}
  .composer textarea{border:0;box-shadow:none;background:transparent;resize:none;padding:.3rem .4rem;max-height:180px;font-size:15px}
  .composer textarea:focus{box-shadow:none}
  .composer-bar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.3rem}
  .sendbtn{width:36px;height:36px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:17px}
  .sendbtn svg{width:17px;height:17px}
  .av svg{width:15px;height:15px}
  .pc-del svg,.projmenu .pm-item button svg{width:15px;height:15px}
  /* project selector (where the model picker would be) */
  .projsel-wrap{position:relative}
  .projsel{display:inline-flex;align-items:center;gap:.45rem;background:var(--surface-soft);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius-sm);padding:.4rem .7rem;font-weight:500;font-size:13px}
  .projsel:hover{background:var(--surface-card)}
  .projsel .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .projsel .cap{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .projmenu{position:absolute;bottom:calc(100% + 8px);left:0;min-width:260px;max-height:min(320px,60vh);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:.4rem;display:none;z-index:30}
  /* the SIDEBAR project switcher sits at the top of the rail → open DOWNWARD (the composer one stays upward) */
  #navmenu{top:calc(100% + 6px);bottom:auto;left:0;right:0;min-width:0}
  .projmenu.open{display:block}
  .projmenu .pm-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-soft);padding:.4rem .6rem .2rem}
  .projmenu .pm-item{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;border-radius:var(--radius-sm);cursor:pointer}
  .projmenu .pm-item:hover{background:var(--surface-soft)}
  .projmenu .pm-item.active{background:var(--accent-soft)}
  .projmenu .pm-item .chk{color:var(--accent);margin-left:auto}

  /* verifiable reference links (trust) */
  .reflink{color:var(--accent);text-decoration:none;border-bottom:1px dotted currentColor}
  .reflink:hover{border-bottom-style:solid}
  .reflink .rlext{font-size:.85em;opacity:.7;margin-left:.15em}

  /* challenge panel (UI-CP-5) — EDOS argues against its own recommendation */
  .challengecard{border:1px solid #f0c9a4;border-top:4px solid #ef8b2c;border-radius:12px;
    background:#fffaf4;margin-top:1.1rem;overflow:hidden}
  .challengecard .ch-head{padding:1rem 1.2rem;border-bottom:1px solid #f3ddc6}
  .challengecard .ch-head .eye{color:#c96a12;font-size:11px;letter-spacing:.16em;font-weight:700}
  .challengecard .ch-head h3{margin:.35rem 0 .1rem;font-size:17px;color:var(--ink)}
  .challengecard .ch-head .asmp{background:#fff;border:1px solid #e7c7a6;border-radius:8px;
    padding:.5rem .7rem;margin-top:.5rem;font-size:13px}
  .challengecard .ch-head .asmp b{color:#c96a12}
  .ch-cols{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .ch-col{padding:1rem 1.2rem}
  .ch-col.cost{background:#fdf1ef;border-right:1px solid #f3ddc6}
  .ch-col.offer{background:#eef8f1}
  .ch-col h4{font-size:11px;letter-spacing:.1em;font-weight:700;margin:0 0 .6rem;text-transform:uppercase}
  .ch-col.cost h4{color:#c23b30}
  .ch-col.offer h4{color:#1f9d61}
  .ch-col ul{margin:0;padding-left:1.1rem}
  .ch-col li{font-size:13px;margin:.4rem 0;line-height:1.45}
  .cost-callout{margin:0;padding:1rem 1.2rem;background:#fbe9e7;border-top:1px solid #f2c8c2;
    color:#8f251c;font-weight:600;font-size:14px;line-height:1.5;display:flex;gap:.6rem;align-items:flex-start}
  .cost-callout .ic{font-size:18px;line-height:1}
  .ch-actions{padding:1rem 1.2rem;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
  .ch-actions .markchg{background:#c23b30;color:#fff;font-weight:700}
  .ch-actions .markchg:hover{background:#a82e25}
  .monitored{padding:.9rem 1.2rem;background:#f3e3db;border-top:1px solid #e8cdbf;
    color:#a9583e;font-size:13px;font-weight:600;display:flex;gap:.5rem;align-items:center}
  @media(max-width:720px){.ch-cols{grid-template-columns:1fr}.ch-col.cost{border-right:0;border-bottom:1px solid #f3ddc6}}

  /* ---- UI-CP-7: Decision Graph (inline SVG) ---- */
  .graphwrap{overflow-x:auto;background:#181715;border-radius:var(--radius);padding:.6rem}
  svg.graph{display:block}
  svg.graph .n-label{font:600 12px system-ui,sans-serif;fill:#fff}
  svg.graph .n-label.dark{fill:#e6e0d5}
  svg.graph .e-label{font:600 10px system-ui,sans-serif;fill:#a09d96;letter-spacing:.02em}
  svg.graph .e-label.conflict{fill:#ff7a7d}
  .glegend{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.7rem;font-size:12px;color:var(--ink2)}
  .glegend .k{display:inline-flex;align-items:center;gap:.4rem}
  .glegend .sw{width:26px;height:14px;border-radius:4px;display:inline-block}

  /* ---- UI-CP-7: Decision Diff ---- */
  .diffcard{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);background:var(--surface);overflow:hidden;margin-top:1rem}
  .diffhead{background:var(--navy);color:#fff;padding:.8rem 1.1rem;font-weight:600;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .diffhead .vtag{font-size:11px;font-weight:800;letter-spacing:.06em;background:#26324f;color:#b8b2a6;padding:.15rem .5rem;border-radius:5px}
  .diffbody{padding:1.1rem}
  .diff-summ{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;font-size:15px}
  .diff-summ .old{text-decoration:line-through;color:var(--ink2);background:#fbeaea;border:1px solid #f2c8c2;border-radius:6px;padding:.25rem .55rem}
  .diff-summ .arw{color:var(--accent);font-weight:800}
  .diff-summ .new{color:#0d6b3f;background:#eafaf1;border:1px solid #bfe9cf;border-radius:6px;padding:.25rem .55rem;font-weight:600}
  .diffcols{display:grid;grid-template-columns:1.3fr 1fr;gap:1rem}
  .diffcols .whyc,.diffcols .affc{border:1px solid var(--line);border-radius:10px;padding:.8rem .9rem}
  .diffcols .whyc .h,.diffcols .affc .h{font-size:11px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
  .diffcols ul{margin:0;padding-left:1.1rem} .diffcols li{font-size:13px;margin:.35rem 0;line-height:1.45}
  @media(max-width:720px){.diffcols{grid-template-columns:1fr}}

  /* UI-CP-9: Execution Context — the dark spec card (PDF p24) */
  .ec-card{background:var(--navy);color:#ece7dc;border:1px solid #2c2a26;border-radius:14px;
    box-shadow:0 8px 30px rgba(10,15,35,.35);padding:0 0 1.4rem;overflow:hidden}
  .ec-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
    padding:1.2rem 1.4rem;background:linear-gradient(120deg,#161d36,#1f2547);border-bottom:1px solid #33302b}
  .ec-title{font-weight:800;letter-spacing:.16em;font-size:15px;color:#fff}
  .ec-tag{font-size:12px;letter-spacing:.04em;color:#d69a80;font-weight:600;margin-top:.15rem}
  .ec-meta{display:flex;align-items:center;gap:.8rem;font-size:12px;color:#a09d96}
  .ec-copy{background:var(--accent);color:#fff;border-radius:8px;padding:.45rem .8rem;font-size:12px;font-weight:600}
  .ec-copy:hover{background:var(--accent2)}
  .ec-subhead{padding:.9rem 1.4rem .2rem;font-size:12.5px;color:#a09d96}
  .ec-prov{display:inline-block;background:#2c2a26;color:#f0ddd2;border:1px solid #5a4a3a;
    border-radius:20px;padding:.1rem .55rem;font-size:11px;font-weight:600;margin-left:.4rem}
  .ec-prov.sm{margin-left:.5rem}
  .ec-sec{padding:1rem 1.4rem 0}
  .ec-h{font-size:11px;letter-spacing:.16em;font-weight:800;text-transform:uppercase;color:#cc785c;
    border-bottom:1px solid #33302b;padding-bottom:.4rem;margin-bottom:.7rem}

  /* ---- Custom action UI: toasts + confirm modal (replaces native alert()/confirm()) ---- */
  /* Toast stack — non-blocking notifications, top-right, colour-coded by type, auto-dismiss with a progress bar. */

    box-shadow:var(--shadow-lg);padding:.8rem .9rem;position:relative;overflow:hidden;
    opacity:0;transform:translateX(16px);transition:opacity .18s ease,transform .18s ease}

  .toast.hide{opacity:0;transform:translateX(16px)}
  .toast-ic{width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center;
    color:var(--accent);margin-top:1px}

  .toast-body .tt{display:block;font-weight:600;color:var(--ink);margin-bottom:.1rem}

  .toast-error{border-left-color:var(--error)} .toast-error .toast-ic{color:var(--error)} .toast-error .toast-bar{background:var(--error)}
  .toast-success{border-left-color:var(--success)} .toast-success .toast-ic{color:var(--success)} .toast-success .toast-bar{background:var(--success)}

  @media (prefers-reduced-motion:reduce){.toast{transition:opacity .12s} .toast-bar{animation:none}}

  /* Confirm modal — blocking dialog with Cancel + action; returns a Promise<boolean> from confirmBox(). */
  .modal-ov{position:fixed;inset:0;z-index:1001;display:flex;align-items:center;justify-content:center;
    background:rgba(20,20,19,.42);backdrop-filter:blur(2px);padding:1.5rem;

<body>
  <aside class="rail" id="rail"></aside>

  <main class="main">
    <div class="view" id="view"></div>
  </main>

  <div id="home"></div>

<script>
const $=s=>document.querySelector(s);
let PID=null, PROJECTS=[], TAB='brain';

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok){let d;try{d=await r.json()}catch{d=await r.text()}throw new Error((d&&d.detail)||JSON.stringify(d)||r.status)}
  return r.status===204?null:r.json();
}
const esc=s=>(s??'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// inline-SVG helper — defined early because both the toast icons and the ICONS map below depend on it.
const _sic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

/* ---- Custom action UI (replaces native alert()/confirm()) ----
   toast(msg,type)         → non-blocking notification (type: 'error' | 'success' | 'info'), auto-dismisses.
   confirmBox({...})       → Promise<boolean>; a real modal with Cancel + action buttons (Esc = cancel, Enter = ok).
   Both are self-contained (no markup / external deps) and follow the app's design tokens. */
const _TOAST_IC={
  error:_sic('<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12" y2="16.5"/>'),
  success:_sic('<circle cx="12" cy="12" r="9"/><polyline points="8.5 12.2 11 14.6 15.8 9.4"/>'),
  info:_sic('<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><line x1="12" y1="7.6" x2="12" y2="7.6"/>'),
};
function toast(msg,type='info',{title='',duration=type==='error'?6000:4200}={}){
  let host=document.getElementById('toastHost');
  if(!host){ host=document.createElement('div'); host.id='toastHost'; host.className='toast-host'; document.body.appendChild(host); }
  const el=document.createElement('div');
  el.className='toast toast-'+type;
  el.setAttribute('role',type==='error'?'alert':'status');
  el.innerHTML=`<span class="toast-ic">${_TOAST_IC[type]||_TOAST_IC.info}</span>`+
    `<div class="toast-body">${title?`<span class="tt">${esc(title)}</span>`:''}${esc(msg)}</div>`+
    `<button class="toast-x" aria-label="Dismiss">×</button>`+
    (duration?`<span class="toast-bar" style="animation-duration:${duration}ms"></span>`:'');
  host.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  let timer;
  const dismiss=()=>{ if(!el.isConnected)return; clearTimeout(timer); el.classList.remove('show'); el.classList.add('hide');
    setTimeout(()=>el.remove(),200); };
  el.querySelector('.toast-x').addEventListener('click',dismiss);
  if(duration) timer=setTimeout(dismiss,duration);
  return dismiss;
}
function confirmBox({title='Are you sure?',message='',confirmLabel='Confirm',cancelLabel='Cancel',danger=false}={}){
  return new Promise(resolve=>{
    const ov=document.createElement('div'); ov.className='modal-ov';
    ov.innerHTML=`<div class="modal-box ${danger?'danger':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-icon">${danger?ICONS.trash:_TOAST_IC.info}</div>
      <div class="modal-title">${esc(title)}</div>
      ${message?`<div class="modal-msg">${esc(message)}</div>`:''}
      <div class="modal-actions">
        <button class="ghost" data-act="cancel">${esc(cancelLabel)}</button>
        <button class="${danger?'danger':''}" data-act="ok">${esc(confirmLabel)}</button>
      </div></div>`;
    document.body.appendChild(ov);
    const done=v=>{ document.removeEventListener('keydown',key); ov.classList.remove('show');
      setTimeout(()=>ov.remove(),160); resolve(v); };
    const key=e=>{ if(e.key==='Escape'){e.preventDefault();done(false);} else if(e.key==='Enter'){e.preventDefault();done(true);} };
    ov.addEventListener('click',e=>{ if(e.target===ov){done(false);return;} const a=e.target.closest('[data-act]'); if(a)done(a.dataset.act==='ok'); });
    document.addEventListener('keydown',key);
    requestAnimationFrame(()=>{ ov.classList.add('show'); const b=ov.querySelector('[data-act="ok"]'); if(b)b.focus(); });
  });
}

// Self-contained inline-SVG icon set (Lucide-style, single-stroke, currentColor) — replaces the ad-hoc
// unicode glyphs so the UI reads consistent. No external requests. Colour follows the surrounding text.
const ICONS={
  brain:_sic('<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'),
  deepdive:_sic('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'),
  review:_sic('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'),
  graph:_sic('<circle cx="18" cy="5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="19" r="2.4"/><line x1="8.1" y1="10.8" x2="15.9" y2="6.2"/><line x1="8.1" y1="13.2" x2="15.9" y2="17.8"/>'),
  timeline:_sic('<circle cx="12" cy="12" r="8.5"/><polyline points="12 7 12 12 15.5 14"/>'),
  execution:_sic('<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>'),
  back:_sic('<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>'),
  docs:_sic('<path d="M2 4a1 1 0 0 1 1-1h5a3.5 3.5 0 0 1 3.5 3.5v13A2.5 2.5 0 0 0 9 17H2z"/><path d="M22 4a1 1 0 0 0-1-1h-5a3.5 3.5 0 0 0-3.5 3.5v13A2.5 2.5 0 0 1 15 17h7z"/>'),
  plus:_sic('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  chevron:_sic('<polyline points="6 9 12 15 18 9"/>'),
  send:_sic('<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>'),
  trash:_sic('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
  external:_sic('<line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>'),
  pencil:_sic('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  check:_sic('<polyline points="20 6 9 17 4 12"/>'),
  spark:_sic('<line x1="12" y1="2.5" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="18.7" y2="18.7"/><line x1="5.3" y1="18.7" x2="18.7" y2="5.3"/>'),
};

// Shared editorial page header used by every section (eyebrow + serif title + optional sub + right actions).
function pageHead(eyebrow,title,sub,actions){
  return `<div class="pagehead"><div class="ph-top">
    <div><div class="hero-eyebrow" style="margin-bottom:.5rem">${esc(eyebrow)}</div><h1>${esc(title)}</h1></div>
    ${actions?`<div class="b-actions">${actions}</div>`:''}</div>
    ${sub?`<div class="ph-sub">${sub}</div>`:''}</div>`;
}

/* ---- References → verifiable links (trust) ----
   A reference becomes a clickable link ONLY when we can resolve a real destination without fabricating one:
   an explicit/inline URL links directly; a recognised public standard (ISO/IEC/IEEE/…) links to an official
   lookup for that exact identifier; internal sources (deep-dive / engineer-answer / decision ids) stay plain
   text. We never invent a specific page — a wrong link would erode trust more than no link. */
const STD_RE=/\b(ISO|IEC|IEEE|SAE|EN|UL|DO|MIL(?:-STD)?|AEC-Q|JEDEC|JESD|CISPR|ASTM|ANSI|ETSI)\s?-?\s?\d[\w.\-]*/i;
function refURL(text,url){
  const t=(text||'').toString().trim();
  if(url&&/^https?:\/\//i.test(url)) return url;
  if(/^https?:\/\//i.test(t)) return t;
  if(/^www\./i.test(t)) return 'https://'+t;
  const m=t.match(STD_RE);
  if(m) return 'https://www.google.com/search?q='+encodeURIComponent(m[0].replace(/\s+/g,' ').trim()+' standard');
  return null;
}
function refLink(text,url){
  const t=(text||'').toString();
  const href=refURL(t,url);
  if(!href) return esc(t);
  return `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" class="reflink">${esc(t)}<span class="rlext">↗</span></a>`;
}

/* ---- sidebar navigation ---- */
const NAV=[
  ['brain','Brain','brain'],['deepdive','Deep Dive','deepdive'],['review','Engineering Review','review'],
  ['timeline','Timeline','timeline'],['execution','Execution Context','execution'],
];
function paintSidebar(){
  const rail=$('#rail'); if(!rail) return;
  const cur=PROJECTS.find(p=>p.id===PID)||{name:'Select project'};
  const menu=PROJECTS.map(p=>`
    <div class="pm-item ${p.id===PID?'active':''}" onclick="switchProjectNav('${p.id}')">
      <span style="width:7px;height:7px;border-radius:50%;background:${p.id===PID?'var(--accent)':'var(--cream-strong)'}"></span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
      ${p.id===PID?'<span class="chk">✓</span>':`<button class="ghost sm" title="Delete" onclick="event.stopPropagation();delProject('${p.id}','${esc(p.name)}')" style="padding:.1rem .35rem">${ICONS.trash}</button>`}
    </div>`).join('');
  rail.innerHTML=`
    <div class="brand" onclick="goHome()" title="All projects">EDOS</div>
    <div class="navproj-wrap">
      <button class="navproj" onclick="toggleNavMenu(event)">
        <span class="dot"></span><span class="cap">${esc(cur.name)}</span><span class="cv">${ICONS.chevron}</span></button>
      <div class="projmenu" id="navmenu">
        <div class="pm-lbl">Projects · isolated</div>${menu}
        <div class="pm-item" onclick="goHome()" style="color:var(--accent)">＋ New / all projects…</div>
      </div>
    </div>
    <div class="navlbl">Workspace</div>
    <nav class="nav">
      ${NAV.map(([t,label,ic])=>`<button class="navitem ${t===TAB?'active':''}" onclick="tab('${t}')"><span class="ni-ic">${ICONS[ic]}</span>${label}</button>`).join('')}
    </nav>
    <div class="nav-foot">
      <button class="navitem" onclick="goHome()"><span class="ni-ic">${ICONS.back}</span>All projects</button>
      <a class="navitem" href="/docs" target="_blank"><span class="ni-ic">${ICONS.docs}</span>API docs</a>
    </div>`;
}
function toggleNavMenu(e){ if(e) e.stopPropagation(); const m=$('#navmenu'); if(m) m.classList.toggle('open'); }
async function switchProjectNav(id){ const m=$('#navmenu'); if(m) m.classList.remove('open'); if(id!==PID) await openProject(id); }

async function loadProjects(){
  PROJECTS=await api('/v1/projects');
  paintSidebar();
}
async function createProject(name){
  name=(name||'').trim(); if(!name)return;
  const p=await api('/v1/projects',{method:'POST',body:JSON.stringify({name})});
  await loadProjects(); openProject(p.id);
}
async function delProject(id,name){
  if(!await confirmBox({title:`Delete “${name}”?`,message:'This project and all of its data will be permanently removed. This cannot be undone.',confirmLabel:'Delete project',danger:true}))return;
  await api(`/v1/projects/${id}`,{method:'DELETE'});
  if(PID===id)PID=null;
  await loadProjects();
  if(document.body.classList.contains('home')) renderHome();
  else if(!PID) showHome();
  else render();
}
async function openProject(id,target){
  PID=id; HOME=false; document.body.classList.remove('home');
  REVIEWTEXT=''; REVIEWFINDINGS=null;
  DD={topic:'',questions:null,answers:{},envelope:null,busy:false,challenge:null,challenging:false,challenged:false,assumptions:[],sessions:null,reviseOpen:false,revising:false,reviseText:''};
  GRAPH={data:null,contradictions:null,decisions:null,diff:null,diffId:'',busy:false};
  loadProjects(); tab(target||'brain');
}

/* ---- landing / project gallery ---- */
let HOME=false;
function goHome(){ showHome(); }
function showHome(){ PID=null; HOME=true; document.body.classList.add('home'); renderHome(); pushURL(); }

/* ---- URL routing (hash-based) — refresh + link-sharing work; single /app serving stays intact.
   #/                              → landing
   #/p/{projectId}/{tab}          → a project + tab (brain|deepdive|review|timeline|execution)
   #/p/{projectId}/deepdive/d/{decisionId} → a specific decision (conversation) inside Deep Dive       */
let ROUTING=false;  // true while restoring FROM the url → suppresses re-push (no loops)
function routeString(){
  if(HOME||!PID) return '';
  let r='p/'+PID+'/'+TAB;
  if(TAB==='deepdive' && DD.envelope) r+='/d/'+DD.envelope.id;
  return r;
}
function pushURL(){
  if(ROUTING) return;
  const h='#/'+routeString();

}
async function routeFromURL(){

}

const CATLABEL={contradiction:'Contradiction',hidden_dependency:'Hidden Dependency',assumption:'Assumption',optimization:'Optimization',best_practice:'Best Practice'};
let REVIEWTEXT='', REVIEWFINDINGS=null, REVIEWBUSY=false;

function renderReview(){
  const findings=REVIEWFINDINGS;
  const p=PROJECTS.find(x=>x.id===PID)||{name:'this project'};
  $('#view').innerHTML=`
    <div class="page">
      ${pageHead('Engineering Review','Scan before you commit',
        `A fast principal-engineer pass over what you describe — surfacing contradictions, hidden dependencies, silent assumptions, and missed best practices. No questions asked. Findings can be saved into <b>${esc(p.name)}</b>'s brain.`)}

          <button ${REVIEWBUSY?'disabled':''} onclick="runReview()">${REVIEWBUSY?'Scanning…':'Run Engineering Review'}</button>

function renderFindings(findings){
  if(!findings.length) return `<div class="empty">No findings — either the input is very sparse or nothing tripped a rule, a stored decision, or an inferred assumption. Add more detail and re-run.</div>`;
  const cards=findings.map(f=>`
    <div class="finding ${f.category}">
      <div class="row wrap" style="margin-bottom:.5rem">
        <span class="cat ${f.category}">${esc(CATLABEL[f.category]||f.category)}</span>
        <span class="pill ${f.severity}">${esc(f.severity)}</span>
        <b>${esc(f.title)}</b>
      </div>
      <div>${esc(f.detail)}</div>
      ${(f.if_ignored&&f.if_ignored.length)?`
        <div class="ignore">
          <div class="h">IF YOU IGNORE THIS</div>
          <ul style="margin:.35rem 0 0;padding-left:1.1rem">${f.if_ignored.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        </div>`:''}
      ${(f.evidence&&f.evidence.length)?`<div style="margin-top:.5rem">${f.evidence.map(x=>`<span class="chip">${refLink(typeof x==='string'?x:(x&&(x.source||x.claim)),x&&x.url)}</span>`).join('')}</div>`:''}
    </div>`).join('');
  return `
    <div class="row" style="justify-content:space-between;align-items:center;margin:1.6rem 0 .8rem">
      <div class="section-label" style="font-size:22px;margin:0">${findings.length} finding${findings.length===1?'':'s'}</div>
      <button class="ghost sm" onclick="saveReview()">Save to Project Brain</button>
    </div>
    ${cards}`;
}

async function runReview(){
  REVIEWTEXT=($('#revtext').value||'').trim();
  if(!REVIEWTEXT){ $('#revtext').focus(); return; }
  REVIEWBUSY=true; renderReview();
  try{
    const r=await api(`/v1/projects/${PID}/review`,{method:'POST',body:JSON.stringify({text:REVIEWTEXT})});
    REVIEWFINDINGS=r.findings;
  }catch(e){ toast('review: '+e.message,'error'); }
  REVIEWBUSY=false; renderReview();
}

async function saveReview(){
  if(!REVIEWTEXT) return;
  try{
    await api(`/v1/projects/${PID}/review`,{method:'POST',body:JSON.stringify({text:REVIEWTEXT,save:true})});

}
