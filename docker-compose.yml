# CP-0 local infra. Bring up with:  docker compose up -d
# Postgres (with pgvector) + Redis, matching roadmap Ch 11/13/17.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edos-postgres
    environment:
      POSTGRES_USER: edos
      POSTGRES_PASSWORD: edos
      POSTGRES_DB: edos
    ports:
      - "5432:5432"
    volumes:
      - edos_pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edos -d edos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  edos_pgdata:
