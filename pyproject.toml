[project]
name = "edos"
version = "0.0.1"
description = "Engineering Decision Operating System — persistent engineering-reasoning platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Live LLM SDKs — needed only at go-live. Providers import these lazily, so the core runs and tests pass
# without them installed. Install with:  pip install -e '.[providers]'
providers = [
    "anthropic>=0.40",
    "google-genai>=1.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff==0.16.0",  # pinned: unpinned linter made CI non-deterministic (0.15→0.16 rule changes broke a green commit)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edos"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
