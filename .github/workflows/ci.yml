name: CI

# The checkpoint gate. Every PR must pass this before a human merges it.
on:
  pull_request:
  push:
    branches: [develop, main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edos
          POSTGRES_PASSWORD: edos
          POSTGRES_DB: edos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://edos:edos@localhost:5432/edos
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baseline gate (zero-dependency, always runs)
        run: python3 tests/test_contracts.py

      - name: Install package + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full gate (pytest + ruff)
        run: ./scripts/check.sh
